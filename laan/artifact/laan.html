<title>לאן?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&display=swap">
<style>
/* לאן? as a Claude Artifact.
   Layout: on a phone (≤ 600px) the app is the whole page. Wider, the app sits in an Android phone
   (412×915 logical, scaled to the height) with a small presenter panel beside or under it. */
:root{
  --ground:#F7F3EC; --surface:#FFFFFF; --surface2:#EFE7D8; --ink:#1A1814; --ink2:#4A443B;
  --act:#0B3D91; --act-edge:#072A66; --act-ink:#FFFFFF; --ring:#C3D2EC; --focus:#0B3D91;
  --yes:#12602F; --yes-edge:#0A4320; --no:#B00020; --no-edge:#74000F; --yes-ink:#FFFFFF; --no-ink:#FFFFFF;
  --amber:#FFE7A3; --amber-edge:#A86F00; --press:#E3D8C3; --placeholder:#5A534A;
  --band:#FFD400; --band-ink:#1A1814; --plate:#FFFFFF; --plate-ink:#1A1814;
  --lift:0 1px 2px rgba(26,24,20,.08), 0 8px 24px rgba(26,24,20,.06);
  --map-bg:#E9E1D2; --map-street:#FFFFFF; --map-bus:#8C8272; --map-stop:#FFFFFF; --map-me:#0B3D91; --map-pin:#B00020;
  /* presenter page (not the app): never touched by the in-app שחור־צהוב setting */
  --pg-bg:#E6DECF; --pg-surface:#FFFFFF; --pg-ink:#1A1814; --pg-ink2:#463F35; --pg-line:#D5CBB9;
  --pg-act:#0B3D91; --pg-act-ink:#FFFFFF; --pg-chip:#F3EDE2; --pg-chip-on:#0B3D91; --pg-chip-on-ink:#FFFFFF;
  --bezel:#141414; --bezel-edge:#2A2A2A;
  --s:1;                                   /* reading-text scale: ענק = 1.2 (buttons stay) */
  --ui:"Rubik", Arial, sans-serif;
  --sign:"Secular One", "Rubik", Arial, sans-serif;
  --pad:20px; --gap:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16130F; --surface:#221E19; --surface2:#2E2922; --ink:#F4EFE6; --ink2:#D3CABC;
    --act:#8AB4FF; --act-edge:#4F7FD6; --act-ink:#0B1430; --ring:#2C4A80; --focus:#BFD4FF;
    --yes:#74D39A; --yes-edge:#3E9A63; --no:#FF9A8F; --no-edge:#C85A50; --yes-ink:#062313; --no-ink:#3D0008;
    --amber:#FFE7A3; --amber-edge:#E0A93A; --press:#3A342B; --placeholder:#CFC5B6;
    --band:#FFD400; --band-ink:#1A1814; --plate:#FFFFFF; --plate-ink:#1A1814;
    --lift:0 1px 2px rgba(0,0,0,.5);
    --map-bg:#25211B; --map-street:#3B352C; --map-bus:#9A9080; --map-stop:#221E19; --map-me:#8AB4FF; --map-pin:#FF9A8F;
    --pg-bg:#0F0D0A; --pg-surface:#1C1915; --pg-ink:#F4EFE6; --pg-ink2:#C9BFAF; --pg-line:#3A342B;
    --pg-act:#8AB4FF; --pg-act-ink:#0B1430; --pg-chip:#2A251F; --pg-chip-on:#8AB4FF; --pg-chip-on-ink:#0B1430;
    --bezel:#050505; --bezel-edge:#3A3A3A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#16130F; --surface:#221E19; --surface2:#2E2922; --ink:#F4EFE6; --ink2:#D3CABC;
  --act:#8AB4FF; --act-edge:#4F7FD6; --act-ink:#0B1430; --ring:#2C4A80; --focus:#BFD4FF;
  --yes:#74D39A; --yes-edge:#3E9A63; --no:#FF9A8F; --no-edge:#C85A50; --yes-ink:#062313; --no-ink:#3D0008;
  --amber:#FFE7A3; --amber-edge:#E0A93A; --press:#3A342B; --placeholder:#CFC5B6;
  --band:#FFD400; --band-ink:#1A1814; --plate:#FFFFFF; --plate-ink:#1A1814;
  --lift:0 1px 2px rgba(0,0,0,.5);
  --map-bg:#25211B; --map-street:#3B352C; --map-bus:#9A9080; --map-stop:#221E19; --map-me:#8AB4FF; --map-pin:#FF9A8F;
  --pg-bg:#0F0D0A; --pg-surface:#1C1915; --pg-ink:#F4EFE6; --pg-ink2:#C9BFAF; --pg-line:#3A342B;
  --pg-act:#8AB4FF; --pg-act-ink:#0B1430; --pg-chip:#2A251F; --pg-chip-on:#8AB4FF; --pg-chip-on-ink:#0B1430;
  --bezel:#050505; --bezel-edge:#3A3A3A;
  color-scheme:dark;
}
html[data-size="xl"]{ --s:1.2; }
/* the in-app שחור־צהוב setting wins over light and dark (html:root outranks :root:not(...)) */
html:root[data-contrast="hc"]{
  --ground:#000000; --surface:#000000; --surface2:#000000; --ink:#FFE14D; --ink2:#FFE14D;
  --act:#FFE14D; --act-edge:#A88E00; --act-ink:#000000; --ring:#6B5C00; --focus:#FFFFFF;
  --yes:#FFE14D; --yes-edge:#A88E00; --no:#FFE14D; --no-edge:#A88E00; --yes-ink:#000000; --no-ink:#000000;
  --amber:#FFE14D; --amber-edge:#FFE14D; --press:#3A3000; --placeholder:#FFE14D;
  --band:#FFE14D; --band-ink:#000000; --plate:#000000; --plate-ink:#FFE14D; --lift:none;
  --map-bg:#000000; --map-street:#3A3A3A; --map-bus:#FFE14D; --map-stop:#000000; --map-me:#FFE14D; --map-pin:#FFE14D;
}
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; width:100%; height:100%; }
body{ background:var(--pg-bg); color:var(--pg-ink); font-family:var(--ui); overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%; }
#laan{ height:100%; width:100%;
  --sa-t:env(safe-area-inset-top, 0px); --sa-b:env(safe-area-inset-bottom, 0px);
  --sa-l:env(safe-area-inset-left, 0px); --sa-r:env(safe-area-inset-right, 0px); }
bdi{ unicode-bidi:isolate; }
.screen bdi{ white-space:nowrap; }   /* a number (a phone number too) never breaks across lines */

/* ---- the stage: phone screen + presenter panel ---- */
.stage{ height:100%; width:100%; }
.pwrap{ position:relative; width:100%; height:100%; }
.phone{ position:relative; width:100%; height:100%; }
.cam{ display:none; }
.screen{
  position:relative; width:100%; height:100%; overflow:hidden; container:screen / size;
  background:var(--ground); color:var(--ink);
  font-family:var(--ui); font-weight:500; font-size:32px; line-height:1.3;
  overflow-wrap:break-word; font-variant-numeric:tabular-nums;
}
.pp{ display:none; }
@media (min-width: 601px){
  #laan{ --sa-t:0px; --sa-b:0px; --sa-l:0px; --sa-r:0px; }
  .stage{ display:flex; align-items:center; justify-content:center; gap:40px; padding:24px; }
  .pwrap{ flex:0 0 auto; width:calc(436px * var(--k, 1)); height:calc(939px * var(--k, 1)); }
  .phone{ position:absolute; top:0; left:0; width:436px; height:939px; padding:12px; border-radius:44px;
    background:var(--bezel); box-shadow:0 0 0 2px var(--bezel-edge), 0 24px 60px rgba(40,30,10,.28);
    transform:scale(var(--k, 1)); transform-origin:0 0; }
  /* the punch hole sits on the top edge of the glass, above the app's top row, so it never covers text */
  .cam{ display:block; position:absolute; top:5px; left:50%; width:12px; height:12px; margin-left:-6px; border-radius:50%;
    background:#000; box-shadow:0 0 0 2px #262626; z-index:2000; pointer-events:none; }
  .screen{ width:412px; height:915px; border-radius:32px; }
  .pp{ display:flex; }
}
@media (min-width: 601px) and (max-width: 1099px){
  body{ overflow-y:auto; }
  .stage{ height:auto; min-height:100%; flex-direction:column; justify-content:flex-start; padding:24px 16px 48px; }
}

/* ---- presenter panel: for the person showing the app, small type ---- */
.pp{ flex-direction:column; gap:16px; width:340px; max-height:100%; overflow-y:auto; padding:20px; border-radius:20px;
  background:var(--pg-surface); color:var(--pg-ink); font-size:16px; line-height:1.45; font-weight:400;
  box-shadow:0 1px 2px rgba(26,24,20,.08), 0 8px 24px rgba(26,24,20,.08); }
@media (min-width: 601px) and (max-width: 1099px){ .pp{ width:min(100%, 720px); max-height:none; overflow:visible; } }
.pp-head{ display:flex; align-items:center; gap:12px; }
.pp-mark{ font-family:var(--sign); font-size:22px; line-height:1.2; background:#FFD400; color:#1A1814; border-radius:8px; padding:2px 10px; }
.pp-title{ font-weight:700; font-size:18px; margin:0; }
.pp-note{ margin:0; color:var(--pg-ink2); font-size:16px; }
.pp button{ font-family:var(--ui); cursor:pointer; border:0; margin:0; }
.pp button:focus-visible, .pp a:focus-visible{ outline:3px solid var(--pg-act); outline-offset:2px; }
.pp-run{ min-height:48px; border-radius:12px; padding:8px 16px; background:var(--pg-act); color:var(--pg-act-ink); font-weight:700; font-size:18px; width:100%; }
.pp-status{ margin:0; font-size:16px; color:var(--pg-ink2); min-height:1.45em; font-variant-numeric:tabular-nums; }
.pp-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.pp-row > span{ font-weight:700; font-size:16px; min-width:3.5em; }
.seg{ display:inline-flex; border-radius:10px; overflow:hidden; box-shadow:inset 0 0 0 2px var(--pg-line); }
.seg button{ min-height:40px; min-width:64px; padding:4px 14px; background:transparent; color:var(--pg-ink); font-size:16px; font-weight:500; }
.seg button[aria-pressed="true"]{ background:var(--pg-chip-on); color:var(--pg-chip-on-ink); font-weight:700; }
.pp-group{ display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--pg-line); padding-top:12px; }
.pp-group h3{ margin:0; font-size:16px; font-weight:700; }
.pp-group h4{ margin:4px 0 0; font-size:16px; font-weight:500; color:var(--pg-ink2); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chips a{ display:inline-flex; align-items:center; min-height:36px; padding:4px 12px; border-radius:999px; background:var(--pg-chip); color:var(--pg-ink);
  text-decoration:none; font-size:16px; font-weight:500; line-height:1.2; }
.chips a[aria-current="true"]{ background:var(--pg-chip-on); color:var(--pg-chip-on-ink); font-weight:700; }
.chips a .no{ font-variant-numeric:tabular-nums; margin-inline-end:6px; opacity:.85; }
@media (min-width: 601px) and (max-width: 1099px){ #ppNav{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; } }

/* ============ the app (everything inside .screen) ============ */
.nb{ white-space:nowrap; }
.card .nm, .lbl, .band .dir, .alert .where, .list li{ overflow-wrap:normal; }
.i{ width:36px; height:36px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

#app{
  position:relative; height:100%; width:100%; max-width:640px; margin-inline:auto;
  display:flex; flex-direction:column; gap:var(--gap);
  padding-block-start:calc(8px + var(--sa-t));
  padding-inline:calc(var(--pad) + var(--sa-l)) calc(var(--pad) + var(--sa-r));
}

/* ---- top row (56px): journey strip / onboarding dots / wordmark ---- */
/* header.top only: a bare .top would also hit the content area's "mid top" state */
header.top{ flex:0 0 auto; height:56px; display:flex; align-items:center; gap:12px; }
#lead{ display:flex; align-items:center; }
#lead:empty{ display:none; }
.mark{ font-family:var(--sign); font-size:32px; line-height:1.25; background:var(--band); color:var(--band-ink); border-radius:10px; padding:0 14px; }
.strip{ display:flex; align-items:center; }
.strip .n{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; background:var(--surface2); color:var(--ink2); }
.strip .n .i{ width:22px; height:22px; }
.strip .n.done{ background:var(--press); color:var(--ink); }
.strip .n.cur{ background:var(--act); color:var(--act-ink); box-shadow:0 0 0 4px var(--ring); }
.strip .ln{ width:24px; height:3px; margin-inline:4px; border-radius:2px; background:var(--surface2); }
.strip .ln.done{ background:var(--ink2); }
html[data-contrast="hc"] .strip .n.done{ background:#000; color:var(--ink); }
html[data-contrast="hc"] .strip .n:not(.cur){ outline:3px solid var(--ink); outline-offset:-3px; }
.dots{ display:flex; align-items:center; gap:8px; }
.dots i{ width:16px; height:16px; border-radius:50%; background:var(--surface2); }
.dots i.on{ background:var(--ink); }
.dots i.cur{ width:24px; height:24px; background:var(--act); box-shadow:0 0 0 4px var(--ring); }
html[data-contrast="hc"] .dots i:not(.on):not(.cur){ outline:3px solid var(--ink); outline-offset:-3px; }
#topstep{ flex:0 1 auto; min-width:0; }
#topstep:empty{ display:none; }
.badge{ position:absolute; top:-26px; z-index:3; inset-inline-end:20px; height:26px; padding:0 8px; font-family:var(--ui); font-weight:500; font-size:24px; line-height:26px;
  color:var(--ink2); background:var(--surface2); border-radius:8px 8px 0 0; pointer-events:none; }

/* ---- main: the sentence block at a fixed y, then one hero block ---- */
.main{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:var(--gap); overflow-x:hidden; overflow-y:auto; }
.block{ display:flex; flex-direction:column; gap:8px; flex:0 0 auto; }
.block.row{ flex-direction:row; align-items:center; gap:16px; }
.block .txt{ display:flex; flex-direction:column; gap:8px; min-width:0; }
.step{ margin:0; font-weight:500; font-size:28px; line-height:1.25; color:var(--ink2); }
.say{ font-family:var(--ui); font-weight:700; font-size:calc(40px * var(--s)); line-height:1.3; margin:0; color:var(--ink); }
.say.big{ font-size:calc(48px * var(--s)); }
.say:focus{ outline:none; }
.sub{ margin:0; font-weight:500; font-size:calc(32px * var(--s)); line-height:1.3; color:var(--ink2); }
.say, .sub{ text-wrap:balance; }
.notice{ margin:0; font-weight:500; font-size:32px; background:var(--surface); box-shadow:var(--lift); border-radius:20px; padding:16px; color:var(--ink); }
.mid{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:16px; }
.mid.top{ justify-content:flex-start; }
.mid:empty{ display:none; }

/* cards: one soft elevation, never an outline */
.card{ display:flex; align-items:center; gap:16px; background:var(--surface); border-radius:20px; padding:16px 20px; box-shadow:var(--lift); }
.card > .i{ width:44px; height:44px; color:var(--act); }
html[data-contrast="hc"] .card > .i{ color:var(--ink); }
.card .txt{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.card .ini{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; background:var(--surface2); font-weight:700; font-size:32px; color:var(--ink); }
.card .lt{ width:56px; height:56px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; background:var(--surface2); color:var(--act); }
.card .lt .i{ width:36px; height:36px; }
html[data-contrast="hc"] .card .lt{ color:var(--ink); }
.sample{ background:var(--surface); border-radius:20px; padding:16px 20px; box-shadow:var(--lift); font-weight:700; font-size:calc(40px * var(--s)); line-height:1.3; color:var(--ink); }
.card .nm{ font-weight:700; font-size:calc(32px * var(--s)); line-height:1.25; color:var(--ink); }
.card .ds{ font-weight:500; font-size:calc(32px * var(--s)); line-height:1.3; color:var(--ink2); }
.card.hero .nm{ font-size:calc(40px * var(--s)); }
/* a phone number to read out or copy: big, left-to-right, selectable */
.tel{ font-family:var(--ui); font-weight:800; font-size:44px;   /* already large: not scaled by ענק, so it never leaves the card */
  line-height:1.15; color:var(--ink); direction:ltr; unicode-bidi:isolate;
  user-select:text; -webkit-user-select:text; white-space:nowrap; letter-spacing:.01em; }
.card .tel{ align-self:flex-start; }
.card.telc{ flex-direction:column; align-items:stretch; gap:12px; }
.telc .telw{ display:flex; align-items:center; gap:16px; }
.telc .tel{ align-self:flex-start; padding-inline-start:4px; }
/* the prepared message: the exact text that is copied */
.msg{ flex:1 1 auto; min-height:140px; overflow-y:auto; background:var(--surface); box-shadow:var(--lift); border-radius:20px; padding:16px 20px;
  font-weight:500; font-size:calc(32px * var(--s)); line-height:1.3; color:var(--ink); user-select:text; -webkit-user-select:text; white-space:pre-line; }
.msg:focus-visible{ outline:4px solid var(--focus); outline-offset:2px; }
html[data-contrast="hc"] .msg{ outline:3px solid var(--ink); outline-offset:-3px; }
.list{ list-style:none; margin:0; padding:8px 16px; display:flex; flex-direction:column; background:var(--surface); border-radius:20px; box-shadow:var(--lift); }
.list li{ display:flex; align-items:center; gap:12px; padding-block:12px; min-height:64px; font-weight:500; font-size:calc(32px * var(--s)); line-height:1.3; color:var(--ink); position:relative; }
.list li + li::before{ content:''; position:absolute; top:0; inset-inline:48px 0; height:2px; background:var(--surface2); }
.list .i{ width:36px; height:36px; margin-block-start:2px; color:var(--act); }
html[data-contrast="hc"] .card, html[data-contrast="hc"] .list, html[data-contrast="hc"] .notice{ outline:3px solid var(--ink); outline-offset:-3px; }
html[data-contrast="hc"] .list .i{ color:var(--ink); }
.okdisc{ width:72px; height:72px; border-radius:50%; display:grid; place-items:center; background:var(--yes); color:var(--yes-ink); flex:0 0 auto; }
.okdisc .i{ width:44px; height:44px; stroke-width:3; }

/* the one signature element: a white plate on a yellow band */
.band{ background:var(--band); color:var(--band-ink); border-radius:20px; padding:16px 20px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.band.row{ flex-direction:row; text-align:start; gap:20px; }
.plate{ font-family:var(--sign); font-weight:400; font-synthesis:none; font-size:120px; line-height:1; letter-spacing:-0.02em; background:var(--plate); color:var(--plate-ink); border:4px solid var(--plate-ink); border-radius:12px; padding:16px 32px 8px; min-width:1.4em; text-align:center; flex:0 0 auto; }
.plate.sm{ font-size:96px; padding:10px 22px 4px; }
html[data-contrast="hc"] .plate{ border-color:#000000; }
.band .dir{ font-weight:700; font-size:32px; line-height:1.25; white-space:nowrap; }
.band .dir .k, .band .dir .v{ display:none; }
.band.row .dir{ display:flex; flex-direction:column; }
.band.row .dir .full{ display:none; }
.band.row .dir .k{ display:block; font-weight:500; font-size:28px; }
.band.row .dir .v{ display:block; }
.band .cap{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.band .k{ font-weight:500; font-size:28px; line-height:1.2; }
.band .tag{ font-weight:700; font-size:32px; line-height:1.25; }
/* a big figure: the one hero fact */
.fig{ display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; column-gap:12px; row-gap:0; color:var(--ink); }
.fig .num{ font-family:var(--sign); font-size:96px; line-height:1; letter-spacing:-0.02em; }
.fig.sec .num{ font-size:72px; }
.fig .unit{ font-weight:700; font-size:calc(32px * var(--s)); line-height:1.2; }
.fig.md .num{ font-family:var(--ui); font-weight:800; font-size:48px; line-height:1.1; }
.fig.md{ justify-content:flex-start; }
.fig.md .soft{ margin-inline-start:12px; }
.short .b-sec span{ text-align:start; }
.fig .sep{ font-weight:700; font-size:32px; color:var(--ink2); }
.fig .soft{ font-weight:500; font-size:calc(32px * var(--s)); color:var(--ink2); }
.figcap{ margin:0; text-align:center; font-weight:500; font-size:28px; line-height:1.25; color:var(--ink2); }

/* ---- buttons: primary / yes-no / secondary surface / quiet ---- */
:where(.screen) button{
  font-family:var(--ui); font-weight:700; font-size:32px; line-height:1.2;
  width:100%; margin:0; border:0; border-radius:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:12px; padding:8px 20px;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  text-wrap:balance; color:var(--ink); background:transparent;
}
:where(.screen) button:focus-visible{ outline:4px solid var(--focus); outline-offset:2px; }
.b-pri, .b-yes, .b-no{ min-height:92px; font-size:32px; padding:8px 20px 12px; white-space:nowrap; box-shadow:inset 0 -4px 0 var(--edge); }
.b-pri{ background:var(--act); color:var(--act-ink); --edge:var(--act-edge); }
.b-yes{ background:var(--yes); color:var(--yes-ink); --edge:var(--yes-edge); }
.b-no{ background:var(--no); color:var(--no-ink); --edge:var(--no-edge); }
.b-pri:active, .b-yes:active, .b-no:active, .mic:active{ box-shadow:inset 0 -1px 0 var(--edge); padding-block:11px 9px; }
.b-sec{ min-height:76px; background:var(--surface2); color:var(--ink); white-space:nowrap; }
.b-sec:active, .tile:active, .opt:active, .who button:active{ background:var(--press); }
.b-quiet:active{ background:var(--surface2); }
.b-quiet{ min-height:72px; font-weight:500; font-size:32px; color:var(--ink); text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:7px; padding-block:4px; }
.b-quiet .i{ width:32px; height:32px; }

<script>
/* claude-host.js - lets the "לאן?" app run as a Claude-hosted Artifact with no server.
 *
 * Does nothing (window.LaanHost stays undefined) unless window.claude.use exists.
 * Inside an Artifact it exposes:
 *   window.LaanHostReady  Promise resolving to window.LaanHost once capabilities have resolved
 *   window.LaanHost = {
 *     noServer: true,
 *     understand(text, city)  -> Promise<{query, display_name}|null>      (sample.json, "quick")
 *     whereAmI({lat,lon,street,step,route,gender,seen,candidates})
 *                             -> Promise<{text, match}|null>              (sample.json, "quick")
 *     dictation: null | { start(onFinal(fullText), onState("listening"|"idle")), stop() }
 *     speak(text)             -> Promise<boolean>   (false: caller falls back to speechSynthesis)
 *   }
 * Every method returns null/false when a capability is absent or refused; none throws.
 * After rate_limited / not_granted / similar a capability is switched off for this page load
 * and never called again (no retries). Results are plain strings: the app must use textContent.
 */
function laanHostSetup() {
  "use strict";
  var W = typeof window !== "undefined" ? window : null;
  if (!W || W.LaanHost || !W.claude || typeof W.claude.use !== "function") return;

  var off = { sample: false, tts: false, dictation: false };
  var S = null, T = null, D = null;
  var STOP = { rate_limited: 1, not_granted: 1, sampling_disabled: 1, not_declared: 1,
               capability_disabled: 1, capability_removed: 1, session_expired: 1 };

  function use(name) {
    try { return Promise.resolve(W.claude.use(name)).catch(function () { return null; }); }
    catch (e) { return Promise.resolve(null); }
  }
  function str(v) { return typeof v === "string" ? v.trim() : ""; }
  function fail(cap, e) { if (e && STOP[e.code]) off[cap] = true; return null; }

  var DEST = "You turn an elderly Israeli's spoken Hebrew into a place search. " +
    "Strip filler such as 'אני צריך להגיע ל', 'בבקשה', 'תביא אותי'. Expand common phrasings " +
    "(e.g. 'קופת חולים בדיזנגוף' means a health clinic on Dizengoff street). If no city is " +
    "mentioned, use the city given to you. Reply with JSON only: " +
    '{"query": "<Hebrew query for Nominatim, street and city>", ' +
    '"display_name": "<short Hebrew name, max 6 words, to read aloud>"}';

  var WHERE = "You calm and orient an elderly person who feels lost on a bus journey in Israel. " +
    "Answer in ONE Hebrew sentence of at most 14 simple words: where they are and what to do " +
    "next. No questions, no apologies, no technical words, no English. Use the grammatical " +
    "gender given to you. Reply with JSON only: " +
    '{"text": "<the sentence>", "match": null}';

  var MATCH = "You help an elderly person who feels lost on a bus journey in Israel. You get a list of " +
    "named places near them and what they say they see. Decide which candidate they most likely " +
    "see (spelling, spacing and hyphens may differ; they may be speaking from memory). Answer ONE " +
    "calm Hebrew sentence of at most 14 simple words telling them where they are, next to that " +
    "place. No questions, no apologies, no English. Use the grammatical gender given to you. " +
    "Reply with JSON only: " +
    '{"text": "<the sentence>", "match": "<the candidate name exactly as given, or null>"}';

  function understand(text, city) {
    text = str(text);
    if (!S || off.sample || !text) return Promise.resolve(null);
    var p = DEST + "\n\nCity: " + (str(city) || "תל אביב") + "\nSpeech: " + text;
    return S.json(p, { modelTier: "quick" }).then(function (o) {
      var q = o && str(o.query);
      return q ? { query: q, display_name: str(o.display_name) || q } : null;
    }, function (e) { return fail("sample", e); }).catch(function () { return null; });
  }

  function whereAmI(b) {
    b = b || {};
    if (!S || off.sample) return Promise.resolve(null);
    var g = b.gender === "f" ? "f" : "m";
    var seen = str(b.seen);
    var cands = (Array.isArray(b.candidates) ? b.candidates : [])
      .map(String).filter(function (c) { return c.trim(); }).slice(0, 12);
    var p = (seen ? MATCH : WHERE) + "\n\nGender: " + g + "\nLocation: " + b.lat + ", " + b.lon +
      "\nNearest street: " + (b.street || "") + "\nCurrent step: " + (b.step || "") +
      "\nRoute: " + (b.route || "");
    if (seen) p += "\nCandidates: " + JSON.stringify(cands) + "\nThe person says they see: " + seen;
    try {
      return S.json(p, { modelTier: "quick", cache: false }).then(function (o) {
        var t = o && str(o.text).replace(/^"+|"+$/g, "");
        if (!t) return null;
        return { text: t, match: seen && cands.indexOf(o.match) >= 0 ? o.match : null };
      }, function (e) { return fail("sample", e); }).catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  }

  var muted = false;
  function speak(text) {
    text = str(text);
    if (muted) return Promise.resolve(true);   // viewer turned the voice off: respect it, stay silent
    if (!T || off.tts || !text) return Promise.resolve(false);
    try {
      return Promise.resolve(T.speak(text, { language: "he", rate: 0.85 })).then(
        function () { return true; },
        function (e) {
          fail("tts", e);
          if (e && e.code === "not_granted") { muted = true; return true; }
          if (e && (e.code === "stopped" || e.code === "busy")) return true;   // replaced, stopped by the viewer, or dictating: stay silent
          return false; });
    } catch (e) { return Promise.resolve(false); }

/* ---------- geometry ---------- */
function dist(a, b){
  const R = 6371000, rad = Math.PI / 180;
  const la1 = (a.lat != null ? a.lat : a[0]) * rad, la2 = (b.lat != null ? b.lat : b[0]) * rad;
  const lo1 = (a.lon != null ? a.lon : a[1]) * rad, lo2 = (b.lon != null ? b.lon : b[1]) * rad;
  const x = Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
const P = o => [o.lat, o.lon];
function pathLen(path){ let s = 0; for (let i = 1; i < path.length; i++) s += dist(path[i - 1], path[i]); return s; }
function along(path, f){
  const total = pathLen(path); let target = f * total;
  for (let i = 1; i < path.length; i++){
    const seg = dist(path[i - 1], path[i]);
    if (target <= seg || i === path.length - 1){
      const k = seg ? Math.min(1, target / seg) : 1;
      return { lat: path[i - 1][0] + (path[i][0] - path[i - 1][0]) * k, lon: path[i - 1][1] + (path[i][1] - path[i - 1][1]) * k };
    }
    target -= seg;
  }
  return { lat: path[0][0], lon: path[0][1] };
}
function pathFrom(path, pos){
  if (!pos) return path;
  let best = 0, bd = Infinity;
  path.forEach((p, i) => { const d = dist(p, pos); if (d < bd){ bd = d; best = i; } });
  const rest = path.slice(best + 1);
  return rest.length ? [P(pos)].concat(rest) : [P(pos), path[path.length - 1]];
}
/* shortest distance from a point to a polyline, in metres (local flat projection) */
function distToPath(pos, path){
  if (!path || !path.length) return 0;
  const lat0 = pos.lat * Math.PI / 180, kx = 111320 * Math.cos(lat0), ky = 110540;
  const xy = p => [(p[1] - pos.lon) * kx, (p[0] - pos.lat) * ky];
  if (path.length === 1){ const a = xy(path[0]); return Math.hypot(a[0], a[1]); }
  let best = Infinity;
  for (let i = 1; i < path.length; i++){
    const a = xy(path[i - 1]), b = xy(path[i]);
    const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
    const k = L2 ? Math.max(0, Math.min(1, -(a[0] * dx + a[1] * dy) / L2)) : 0;
    best = Math.min(best, Math.hypot(a[0] + k * dx, a[1] + k * dy));
  }
  return best;
}
/* demo &lost=1: walk out sideways off the middle of the path, then come back */
function detour(path, off){
  const half = pathLen(path) / 2;
  let acc = 0;
  for (let i = 1; i < path.length; i++){
    const seg = dist(path[i - 1], path[i]);
    if (acc + seg >= half){
      const k = seg ? (half - acc) / seg : 0, a = path[i - 1], b = path[i];
      const M = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
      const cos = Math.cos(M[0] * Math.PI / 180);
      const vx = (b[1] - a[1]) * 111320 * cos, vy = (b[0] - a[0]) * 110540, L = Math.hypot(vx, vy) || 1;
      const side = k2 => [M[0] + k2 * (vx / L) * off / 110540, M[1] + k2 * (-vy / L) * off / (111320 * cos)];
      const A = side(1), B = side(-1), far = q => distToPath({ lat: q[0], lon: q[1] }, path);
      const O = far(A) >= far(B) ? A : B;          // the side that really leads away from the route
      return path.slice(0, i).concat([M, O, M], path.slice(i));
    }
    acc += seg;
  }

}

    .replace(/\//g, ' פינת ').replace(/[()]/g, ', ').replace(/[✓✗—·]/g, ' ')

function listen(onText){
  try { speechSynthesis.cancel(); } catch (e) {}
  const host = hostDictation(); if (!host) return;
  let got = false, heard = false;
  const end = () => { try { host.stop(); } catch (e) {} };
  S.rec = { stop: end, abort: end };
  setListening(true);
  try {
    host.start(txt => {
      if (got) return;
      txt = String(txt || '').trim(); if (!txt) return;
      got = true; S.rec = null; end(); setListening(false); onText(txt);
    }, st => {
      if (st === 'listening'){ heard = true; setListening(true); return; }
      if (got) return;
      S.rec = null; setListening(false);
      if (!heard){            // refused or unavailable before it ever listened: typing only from now on
        S.micBlocked = true; const m = $('mic'); if (m) m.hidden = true;
        setSay(t('noMic'), t('writeHere'), true);

function fallbackPlan(dest){
  const fwd = dist(dest, FALLBACK.dest) <= dist(dest, FALLBACK.start);
  const list = fwd ? FALLBACK.stops.slice() : FALLBACK.stops.slice().reverse();
  return {
    line: FALLBACK.line, headsign: fwd ? FALLBACK.headsign : FALLBACK.headsignBack,
    origin_stop: list[0], stops: list.slice(1), dest_stop: list[list.length - 1],
    departs_in_min: FALLBACK.departs_in_min, fallback: true
  };
}
function currentPos(timeout){

async function walkPath(a, b, timeout){
  const straight = () => ({ meters: Math.round(dist(a, b)), path: [P(a), P(b)] });
  if (DEMO || !a || !b || noServer()){
    if (a && b && dist(a, FALLBACK.start) < 15 && dist(b, FALLBACK.stops[0]) < 15)
      return { meters: Math.round(pathLen(FALLBACK.walkTo)), path: FALLBACK.walkTo.slice() };
    return a && b ? straight() : { meters: 0, path: [] };
  }
  const r = await api('GET', `api/walk?from=${a.lat},${a.lon}&to=${b.lat},${b.lon}`, null, timeout);
  if (r.ok && Array.isArray(r.path) && r.path.length > 1) return { meters: Math.round(r.meters || pathLen(r.path)), path: r.path };
  return straight();
}

async function planJourney(dest){

/* ---------- position: one handler for GPS and the demo simulator ---------- */
function onPos(lat, lon, acc){
  S.pos = { lat, lon }; S.acc = acc;
  updateMe();
  if (!journey || S.paused) return;
  if (Date.now() - S.lastPosSave > 2000 && ['walk', 'ride', 'finalwalk'].includes(journey.step)){
    S.lastPosSave = Date.now(); journey.lastPos = { lat, lon }; saveJourney();
  }
  if (acc > 60){
    if (!DEMO && ['walk', 'finalwalk', 'stop'].includes(journey.step) && !S.overlay){
      S.weakSince = S.weakSince || Date.now();
      if (Date.now() - S.weakSince > 30000 && !journey['weak_' + journey.step]){ journey['weak_' + journey.step] = true; saveJourney(); caseGpsWeak(); }
    }
    return;
  }
  S.weakSince = 0;
  const pos = S.pos;
  if (journey.step === 'walk'){
    const d = dist(pos, journey.plan.origin_stop);
    if (S.screen === 'walk' && journey.walking){ const w = $('walkfig'); if (w) w.innerHTML = walkFig(d < 50 ? 0 : round50(d)); }
    if (d <= 30 && S.screen === 'walk') return toStop();
    checkOffRoute(pos, acc);
  } else if (journey.step === 'ride'){
    rideProgress(pos);
  } else if (journey.step === 'finalwalk'){
    if (dist(pos, journey.dest) <= 30 && S.screen === 'finalwalk') return toArrived();
    if (S.screen === 'finalwalk'){ const w = $('walkfig'); const dd = dist(pos, journey.dest); if (w) w.innerHTML = walkFig(dd < 50 ? 0 : round50(dd), walkMinutes(dd)); }
    checkOffRoute(pos, acc);
  }
}
function rideProgress(pos){
  const stops = journey.plan.stops, last = stops.length - 1;
  let changed = false;
  for (let i = journey.passedIdx + 1; i < stops.length; i++){
    if (dist(pos, stops[i]) <= 40){ journey.passedIdx = i; changed = true; }
  }
  const dd = dist(pos, stops[last]);
  journey.minDest = journey.minDest == null ? dd : Math.min(journey.minDest, dd);
  if (changed){
    saveJourney();
    if (journey.passedIdx >= last){ if (!S.alertOn) toOff(); return; }
    if (S.screen === 'ride') screenRide();
    return;
  }
  const offLine = distToPath(pos, [P(journey.plan.origin_stop)].concat(stops.map(P)));
  if (offLine > 300 && !S.alertOn && S.screen === 'ride'){
    S.rideOff = (S.rideOff || 0) + 1;
    if (S.rideOff >= 3){
      S.rideOff = 0;
      if (journey.passedIdx < 0 && !journey.wrongShown){ journey.wrongShown = true; saveJourney(); return caseWrongBus(); }
      if (journey.passedIdx >= 0 && !journey.detourShown){ journey.detourShown = true; saveJourney(); return caseDetour(); }
    }
  } else S.rideOff = 0;
  if (journey.passedIdx < last && journey.minDest < 200 && dd > journey.minDest + 150 && !S.alertOn && S.screen === 'ride'){
    SIM.stop(); journey.step = 'passed'; saveJourney(); screenPassed();
  }
}
/* off the walking path: > 60 m from the line, or 40 m further from the target than the closest point
   reached — for 3 good fixes in a row (≥ 4 s apart) or 45 s. Never more often than every 3 minutes. */
function checkOffRoute(pos, acc){
  if (!journey || S.overlay || S.alertOn || acc > 60) return;
  const st = journey.step;
  if (!((st === 'walk' && journey.walking) || st === 'finalwalk')) return;
  if (S.screen !== 'walk' && S.screen !== 'finalwalk') return;
  const now = Date.now();
  if (now < S.offQuietUntil) return;
  const path = st === 'walk' ? journey.walkTo.path : journey.walkFrom.path;
  const target = st === 'walk' ? journey.plan.origin_stop : journey.dest;
  const dT = dist(pos, target);
  if (!S.off || S.off.step !== st) S.off = { step: st, minT: dT, n: 0, since: 0, lastAt: 0 };
  const o = S.off;
  o.minT = Math.min(o.minT, dT);
  const away = distToPath(pos, path) > 60 || dT > o.minT + 40;
  if (!away){ o.n = 0; o.since = 0; return; }
  if (!o.since) o.since = now;
  const gap = DEMO ? 1000 / SPEED : 4000;
  if (now - o.lastAt >= gap){ o.n++; o.lastAt = now; }
  if (o.n >= 3 || now - o.since >= 45000){ o.n = 0; o.since = 0; openOffroute(); }
}

/* ---------- demo simulator: moves a fake position along a path ---------- */
const SIM = {
  timer: null, kind: null,
  run(kind, path, mps){
    this.stop();
    if (SHOT || S.hold || !path || path.length < 2) return;   // a jumped-to screen waits for a tap
    this.kind = kind;
    const total = pathLen(path), dur = Math.max(1000, total / (mps * SPEED) * 1000);
    let t = 0;
    this.timer = setInterval(() => {
      if (S.paused) return;
      t += 200;
      const p = along(path, Math.min(1, t / dur));
      onPos(p.lat, p.lon, 8);
      if (t >= dur) this.stop();
    }, 200);
  },
  stop(){ if (this.timer) clearInterval(this.timer); this.timer = null; this.kind = null; }
};

const DEF_KIND = { 'בית מרקחת': 'בית המרקחת', 'בנק': 'הבנק', 'סופרמרקט': 'הסופרמרקט', 'מרפאה': 'המרפאה',
  'דואר': 'הדואר', 'בית ספר': 'בית הספר', 'בית כנסת': 'בית הכנסת', 'גן ציבורי': 'הגן הציבורי', 'חנות': 'החנות',
  'בית קפה': 'בית הקפה', 'מסעדה': 'המסעדה', 'מקום': 'המקום', 'כיכר': 'הכיכר', 'תחנת אוטובוס': 'התחנה' };
function landmarkPhrase(it){
  if (it.kind === 'street') return `שלט של רחוב ${it.name}`;
  if (it.isStop) return `את התחנה ${nm(it.name)}`;
  return `את ${it.name}`;              // the card under the question names the kind
}
const normHe = s => String(s || '').replace(/[֑-ׇ]/g, '').replace(/[^א-תA-Za-z0-9]/g, '').replace(/^ה(?=..)/, '').toLowerCase();
function fuzzyPick(seen, items){
  const n = normHe(seen); if (n.length < 2) return null;
  let best = null;
  items.forEach(it => { const m = normHe(it.name); if (m.length >= 2 && (m.includes(n) || n.includes(m)) && (!best || m.length > normHe(best.name).length)) best = it; });
  return best;
}
function journeyStopFor(pos){
  if (!journey) return null;
  const st = journey.step;
  if (st === 'walk' || st === 'stop') return journey.plan.origin_stop;
  if (st === 'finalwalk' || st === 'off') return journey.plan.dest_stop;
  let best = null, bd = Infinity;
  [journey.plan.origin_stop].concat(journey.plan.stops).forEach(s => { const d = dist(pos, s); if (d < bd){ bd = d; best = s; } });
  return best;
}
async function gatherLost(){
  let pos = S.pos;
  if (!DEMO){ const f = await freshFix(8000, 0); if (f) pos = f; }
  pos = pos || (journey && (journey.lastPos || journey.origin)) || FALLBACK.start;
  let street = '', items = [];
  if (DEMO){ street = 'דיזנגוף'; items = DEMO_NEARBY.map(x => Object.assign({}, x)); }
  else {
    const [rev, near] = await Promise.all([
      api('GET', `api/reverse?lat=${pos.lat}&lon=${pos.lon}`, null, 4000),
      api('GET', `api/nearby?lat=${pos.lat}&lon=${pos.lon}`, null, 7000)
    ]);
    street = (rev.ok && rev.street) || '';
    if (near.ok && Array.isArray(near.items))
      items = near.items.filter(x => x && typeof x.name === 'string' && x.name.trim() && !hasLatin(x.name)).slice(0, 8);
  }
  const js = journeyStopFor(pos);
  if (js && dist(pos, js) <= 80){
    items = items.filter(x => x.name !== js.name);
    items.unshift({ name: js.name, kind_he: 'תחנת אוטובוס', dist: Math.round(dist(pos, js)), isStop: true });

/* ---------- map: an inline schematic drawn from the route ----------
   No tiles, no network. The streets are APPROXIMATE soft lines around Dizengoff St, hand-placed for
   the demo and not surveyed. The bus line is solid with its stops, the walking path is dashed blue,
   "you" is a pulsing dot (still with reduced motion). Drawn in the panel's own pixels, so the labels
   keep their real 32px size. */
const STREETS = [
  [[32.0735,34.7757],[32.0762,34.7748],[32.0775,34.7746],[32.0810,34.7735],[32.0830,34.7730],[32.0870,34.7720],[32.0890,34.7715],[32.0915,34.7709]],
  [[32.0735,34.7767],[32.0755,34.7761],[32.0764,34.7757],[32.0790,34.7752],[32.0830,34.7742],[32.0870,34.7733],[32.0915,34.7722]],
  [[32.0748,34.7725],[32.0753,34.7752],[32.0755,34.7761],[32.0758,34.7790]],
  [[32.0768,34.7715],[32.0762,34.7748],[32.0764,34.7757],[32.0770,34.7790]],
  [[32.0777,34.7720],[32.0775,34.7746],[32.0779,34.7785]],
  [[32.0807,34.7705],[32.0810,34.7735],[32.0814,34.7775]],
  [[32.0827,34.7700],[32.0830,34.7730],[32.0834,34.7770]],
  [[32.0867,34.7690],[32.0870,34.7720],[32.0874,34.7760]],
  [[32.0886,34.7685],[32.0890,34.7715],[32.0896,34.7735],[32.0899,34.7760]]
];
const MAP = { opts: null, proj: null, ro: null };
function mapProject(opts, W, H){
  const pts = opts.path.concat([P(opts.target)], S.pos ? [P(S.pos)] : []);
  const lat0 = pts[0][0], lon0 = pts[0][1];
  const kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110540;
  const m = p => [(p[1] - lon0) * kx, -(p[0] - lat0) * ky];          // metres, y grows downward
  const ms = pts.map(m);
  let x0 = Math.min(...ms.map(q => q[0])), x1 = Math.max(...ms.map(q => q[0]));
  let y0 = Math.min(...ms.map(q => q[1])), y1 = Math.max(...ms.map(q => q[1]));
  const minSpan = 120;
  if (x1 - x0 < minSpan){ const c = (x0 + x1) / 2; x0 = c - minSpan / 2; x1 = c + minSpan / 2; }
  if (y1 - y0 < minSpan){ const c = (y0 + y1) / 2; y0 = c - minSpan / 2; y1 = c + minSpan / 2; }
  const padX = 56, padT = 72, padB = 60;
  const s = Math.max(0.01, Math.min((W - 2 * padX) / (x1 - x0), (H - padT - padB) / (y1 - y0)));
  const ox = W / 2 - (x0 + x1) / 2 * s, oy = padT + (H - padT - padB) / 2 - (y0 + y1) / 2 * s;
  return p => { const q = m(p); return [q[0] * s + ox, q[1] * s + oy]; };
}
/* a label sits above (or below) its marker; if that leaves the panel it flips side, then is clamped in */
function placeLabel(el, x, y, side, W, H, altY){
  if (!el) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  let top = side === 'above' ? y - h : y;
  if (top < 6 || top + h > H - 6) top = side === 'above' ? altY : altY - h;
  top = Math.max(6, Math.min(H - 6 - h, top));
  const left = Math.max(6 + w / 2, Math.min(W - 6 - w / 2, x));
  el.style.left = left.toFixed(1) + 'px'; el.style.top = top.toFixed(1) + 'px';
}
function drawMap(slot, opts){
  const W = slot.clientWidth, H = slot.clientHeight;
  if (!W || !H) return;
  const pr = MAP.proj = mapProject(opts, W, H);
  const xy = p => pr(p).map(v => v.toFixed(1));
  const pl = arr => arr.map(p => xy(p).join(',')).join(' ');
  let svg = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">`;
  STREETS.forEach(s => { svg += `<polyline class="st" points="${pl(s)}"/>`; });
  if (journey && journey.plan && !journey.walkOnly){
    const line = [journey.plan.origin_stop].concat(journey.plan.stops).map(P);
    svg += `<polyline class="bus" points="${pl(line)}"/>`;
    line.forEach(p => { const q = xy(p); svg += `<circle class="bstop" cx="${q[0]}" cy="${q[1]}" r="9"/>`; });
  }
  if (opts.path.length > 1) svg += `<polyline class="walk" points="${pl(opts.path)}"/>`;
  const tg = pr(P(opts.target)), tx = tg[0].toFixed(1), ty = tg[1].toFixed(1);
  svg += `<path class="pin" d="M${tx} ${ty}c-6-10-18-18-18-30a18 18 0 0 1 36 0c0 12-12 20-18 30z"/><circle cx="${tx}" cy="${(tg[1] - 30).toFixed(1)}" r="6" fill="#FFFFFF"/>`;
  const me = pr(S.pos ? P(S.pos) : opts.path[0]);
  svg += `<g id="mapMe" transform="translate(${me[0].toFixed(1)} ${me[1].toFixed(1)})"><circle class="halo" r="30"/><circle class="me" r="14"/></g></svg>`;
  slot.innerHTML = svg + `<span class="lbl" id="lblT">${fmt(opts.label)}</span><span class="lbl" id="lblMe">${esc(t('you'))}</span>`;
  placeLabel($('lblT'), tg[0], tg[1] - 54, 'above', W, H, tg[1] + 10);
  placeLabel($('lblMe'), me[0], me[1] + 22, 'below', W, H, me[1] - 22);
}
function showMap(opts){
  const slot = $('mapslot'); if (!slot || !opts.path || opts.path.length < 1) return;
  MAP.opts = opts;
  drawMap(slot, opts);
  try {
    if (MAP.ro) MAP.ro.disconnect();
    if ('ResizeObserver' in window){
      let w = slot.clientWidth, h = slot.clientHeight;
      MAP.ro = new ResizeObserver(() => {
        if (!slot.isConnected || MAP.opts !== opts) return;
        if (slot.clientWidth !== w || slot.clientHeight !== h){ w = slot.clientWidth; h = slot.clientHeight; drawMap(slot, opts); }
      });
      MAP.ro.observe(slot);
    }
  } catch (e) {}
}
function updateMe(){
  if (!S.pos || !MAP.proj) return;
  const g = document.getElementById('mapMe'), slot = $('mapslot'); if (!g || !slot) return;
  const q = MAP.proj(P(S.pos));
  g.setAttribute('transform', `translate(${q[0].toFixed(1)} ${q[1].toFixed(1)})`);
  placeLabel($('lblMe'), q[0], q[1] + 22, 'below', slot.clientWidth, slot.clientHeight, q[1] - 22);
}

/* ---------- ?screen=<id>: one screen with realistic demo content, frozen ---------- */
function shotJourney(step, extra){
  const plan = fallbackPlan(FALLBACK.dest);
  journey = Object.assign({
    dest: Object.assign({}, FALLBACK.dest), plan, origin: Object.assign({}, FALLBACK.start),
    walkTo: { meters: Math.round(pathLen(FALLBACK.walkTo)), path: FALLBACK.walkTo.slice() },
    walkFrom: { meters: Math.round(dist(plan.dest_stop, FALLBACK.dest)), path: [P(plan.dest_stop), P(FALLBACK.dest)] },
    step, walking: false, passedIdx: -1, departsAt: Date.now() + 4 * MINUTE + 5000, alert: null, minDest: null, lastPos: null,
    startedAt: Date.now() - 18 * MINUTE, arrivedAt: Date.now()
  }, extra || {});
}
function shotLost(){
  S.lost = { pos: along(FALLBACK.walkTo, 0.35), street: 'דיזנגוף', items: DEMO_NEARBY.map(x => Object.assign({}, x)), landmark: null, ready: true };

}

/* a focused field is scrolled to the middle of the content area only (never the page around the phone) */
function intoView(el){
  const main = $('main'); if (!el || !main || !main.contains(el)) return;
  main.scrollTop = Math.max(0, (el.offsetTop - main.offsetTop) - (main.clientHeight - el.offsetHeight) / 2);
}

const LABEL = { dest: 'לאן?', checking: 'בודק', settings: 'הגדרות', alert: 'יורדים בבאה', 'lost-calm': 'איפה אני?' };
JUMPS.forEach(gr => (gr.items || []).forEach(i => { LABEL[i[0]] = LABEL[i[0]] || i[1]; }));
let CUR = '', DEMO_T0 = 0;
const DEFAULT_STATUS = 'דמו בלי ידיים: מהיעד ועד "הגעת!", בערך 75 שניות.';
function buildPanel(){
  const chip = (id, label, no) => `<a href="#${id}" data-jump="${id}">${no ? `<span class="no">${no}</span>` : ''}${esc(label)}</a>`;
  $('ppNav').innerHTML = JUMPS.map(gr => `<section class="pp-group"><h3>${esc(gr.h)}</h3>` +
    (gr.items ? `<div class="chips">${gr.items.map(i => chip(i[0], i[1])).join('')}</div>` : '') +
    (gr.sub ? gr.sub.map(s => `<h4>${esc(s.h)}</h4><div class="chips">${s.items.map(i => chip(i[1], i[2], i[0])).join('')}</div>`).join('') : '') +
    '</section>').join('');
  $('ppNav').addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[data-jump]'); if (!a) return;
    e.preventDefault();
    const id = a.dataset.jump;
    unlockAudio(true);
    jump(id);
    try { if (location.hash.slice(1) !== id){ S.skipHash = id; location.hash = id; } } catch (er) { S.skipHash = null; }
  });
  $('ppRun').addEventListener('click', () => {
    unlockAudio(true);
    if (AUTO){ stopDemo(); status('הדמו נעצר. אפשר להמשיך ללחוץ בטלפון.'); } else startDemo();
  });
  const gset = gd => () => { settings.gender = gd; applySettings(); rerender(); };
  $('ppM').addEventListener('click', gset('m'));
  $('ppF').addEventListener('click', gset('f'));
  $('ppVon').addEventListener('click', () => { settings.voice = true; unlockAudio(true); syncPanel(); });
  $('ppVoff').addEventListener('click', () => { settings.voice = false; S.pendingVoice = null; try { speechSynthesis.cancel(); } catch (e) {} syncPanel(); });
}
function markPanel(){
  document.querySelectorAll('#ppNav a[data-jump]').forEach(a => a.setAttribute('aria-current', a.dataset.jump === CUR ? 'true' : 'false'));
}
function syncPanel(){
  const set = (id, on) => { const b = $(id); if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false'); };
  set('ppM', settings.gender !== 'f'); set('ppF', settings.gender === 'f');
  set('ppVon', !!settings.voice); set('ppVoff', !settings.voice);
}
function status(s){ const el = $('ppStatus'); if (el) el.textContent = s; }
function updStatus(){
  if (!AUTO) return;
  const sc = document.body.dataset.screen;
  status(`הדמו רץ · ${Math.round((Date.now() - DEMO_T0) / 1000)} שניות · ${LABEL[sc] || sc}`);
}
function onRendered(name){
  syncPanel();
  if (!AUTO) return;
  if (name === 'arrived'){
    const secs = (Date.now() - DEMO_T0) / 1000;
    window.laanDemoSeconds = Math.round(secs * 10) / 10;
    stopDemo();
    status(`הגעת! הדמו הגיע ליעד אחרי ${Math.round(secs)} שניות.`);
  } else updStatus();
}
function setRun(on){ $('ppRun').textContent = on ? '■ לעצור את הדמו' : '▶︎ להתחיל דמו'; }
function stopDemo(){
  AUTO = false; MINUTE = 60000;
  if (S.demoTick){ clearInterval(S.demoTick); S.demoTick = null; }
  setRun(false);
}
/* back to a clean demo state; the viewer's own choices (אתה/את, voice, text size, colours) stay */
function resetAll(){
  S.gen++; S.helpTok++;
  clearScreenTimers(); SIM.stop(); closeAlert(); stopListening();
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  Object.assign(S, { overlay: null, paused: false, busy: false, lost: null, off: null, offQuietUntil: 0, detoured: false,
    lastBase: null, firstDest: true, rideOff: 0, alertSlow: false, homeCtx: null, lastText: '', planFor: null, weakSince: 0,
    pos: { lat: FALLBACK.start.lat, lon: FALLBACK.start.lon }, acc: 8 });
  journey = null;
  settings = demoSettings({ gender: settings.gender, voice: settings.voice, size: settings.size, contrast: settings.contrast,
                            rate: settings.rate, noVoiceShown: settings.noVoiceShown });
  $('notice').hidden = true;
  applySettings();
}
function jump(id){
  if (!SHOTS[id]) id = 'dest-return';
  const wasAuto = AUTO;
  stopDemo();
  if (wasAuto) status(DEFAULT_STATUS);
  resetAll();
  S.hold = true;                       // the screen stays as it is until someone taps in the phone
  CUR = id;
  SHOTS[id]();
  markPanel();
}
function startDemo(){
  resetAll();
  CUR = ''; markPanel();
  AUTO = true; MINUTE = 2000; S.hold = false;
  settings.visits = 1;                 // the "as if spoken" destination screen
  DEMO_T0 = Date.now();
  setRun(true);
  S.demoTick = setInterval(updStatus, 500);
  screenDest();
}
function rerender(){
  if (AUTO) return;                    // the running demo picks the change up on its next screen
  if (S.alertOn){ if (S.alertSlow) $('alertMiss').textContent = t('alertMissed'); return; }
  if (!S.overlay && S.lastBase) return S.lastBase();
  if (CUR) return jump(CUR);
  if (S.lastBase) S.lastBase();
}
function idFromHash(){
  let h = ''; try { h = decodeURIComponent((location.hash || '').slice(1)).trim(); } catch (e) {}
  return SHOTS[h] ? h : '';
}
window.addEventListener('hashchange', () => {
  const id = idFromHash(); if (!id) return;
  if (S.skipHash === id){ S.skipHash = null; return; }
  jump(id);
});
/* wider than a phone: the phone body is scaled to fit the height (and the width under 1100px) */
function fit(){
  const w = window.innerWidth, h = window.innerHeight;
  let k = 1;
  if (w > 600){
    k = Math.min(1, (h - 48) / 939);
    if (w < 1100) k = Math.min(k, (w - 32) / 436);
    k = Math.max(0.3, k);
  }
  $('laan').style.setProperty('--k', k.toFixed(4));
}
window.addEventListener('resize', fit);
window.laanJump = jump; window.laanStartDemo = startDemo;
function init(){
  buildPanel(); fit();
  $('badge').hidden = false;
  jump(idFromHash() || 'dest-return');   // first frame: the return visit, with real content
}
init();
