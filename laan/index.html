<!doctype html>
<html lang="he" dir="rtl" data-size="l" data-contrast="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D91">
<meta name="description" content="לאן? — הוראה אחת בכל פעם, בדרך לאוטובוס">
<title>לאן?</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- non-blocking: the app must look right even if the fonts never arrive -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Secular+One&display=swap">
<!-- optional host bridge (Claude-hosted Artifact). A 404 here is harmless. -->
<script src="claude-host.js" defer onerror=""></script>
<script>
/* ?frame=1 on a wide screen: show the app inside a centred Android phone (the app itself runs in the frame) */
(function(){
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('frame') !== '1' || window.innerWidth <= 600 || window.self !== window.top) return;
    window.LAAN_FRAMED = true;
    q.delete('frame');
    var src = location.pathname.replace(/^.*\//, '') + (q.toString() ? '?' + q.toString() : '');
    document.addEventListener('DOMContentLoaded', function(){
      document.body.innerHTML = '<div class="pf-stage"><div class="pf-phone"><span class="pf-cam"></span>' +
        '<iframe class="pf-screen" title="לאן?" src="' + (src || 'index.html') + '"></iframe></div></div>';
      document.body.className = 'pf';
      var fit = function(){ var k = Math.min(1, (window.innerHeight - 48) / 939); document.documentElement.style.setProperty('--pfk', k); };
      fit(); window.addEventListener('resize', fit);
    });
  } catch (e) {}
})();
</script>
<style>
:root{
  --ground:#F7F3EC; --surface:#FFFFFF; --surface2:#EFE7D8; --ink:#1A1814; --ink2:#4A443B;
  --act:#0B3D91; --act-edge:#072A66; --act-ink:#FFFFFF; --ring:#C3D2EC; --focus:#0B3D91;
  --yes:#12602F; --yes-edge:#0A4320; --no:#B00020; --no-edge:#74000F; --yn-ink:#FFFFFF;
  --amber:#FFE7A3; --amber-edge:#A86F00; --press:#E3D8C3; --placeholder:#5A534A;
  --band:#FFD400; --band-ink:#1A1814; --plate:#FFFFFF; --plate-ink:#1A1814;
  --lift:0 1px 2px rgba(26,24,20,.08), 0 8px 24px rgba(26,24,20,.06);
  --s:1;                                   /* reading-text scale: ענק = 1.2 (buttons stay) */
  --ui:"Rubik", Arial, sans-serif;
  --sign:"Secular One", "Rubik", Arial, sans-serif;
  --pad:20px; --gap:24px;
}
html[data-size="xl"]{ --s:1.2; }
html[data-contrast="hc"]{
  --ground:#000000; --surface:#000000; --surface2:#000000; --ink:#FFE14D; --ink2:#FFE14D;
  --act:#FFE14D; --act-edge:#A88E00; --act-ink:#000000; --ring:#6B5C00; --focus:#FFFFFF;
  --yes:#FFE14D; --yes-edge:#A88E00; --no:#FFE14D; --no-edge:#A88E00; --yn-ink:#000000;
  --amber:#FFE14D; --amber-edge:#FFE14D;
  --band:#FFE14D; --band-ink:#000000; --plate:#000000; --plate-ink:#FFE14D; --lift:none;
}
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; width:100%; height:100%; background:var(--ground); color:var(--ink); }
body{
  font-family:var(--ui); font-weight:500; font-size:32px; line-height:1.3;
  overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%; overflow-wrap:break-word;
  font-variant-numeric:tabular-nums;
}
bdi{ unicode-bidi:isolate; }
.nb{ white-space:nowrap; }
.card .nm, .lbl, .band .dir, .alert .where, .list li{ overflow-wrap:normal; }
.i{ width:36px; height:36px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

#app{
  position:relative; height:100dvh; width:100%; max-width:640px; margin-inline:auto;
  display:flex; flex-direction:column; gap:var(--gap);
  padding-block-start:calc(8px + env(safe-area-inset-top));
  padding-inline:calc(var(--pad) + env(safe-area-inset-left)) calc(var(--pad) + env(safe-area-inset-right));
}

/* ---- top row (56px): journey strip / onboarding dots / wordmark ---- */
.top{ flex:0 0 auto; height:56px; display:flex; align-items:center; }
#lead{ display:flex; align-items:center; }
#lead:empty{ display:none; }
.mark{ font-family:var(--sign); font-size:32px; line-height:1.25; background:var(--band); color:var(--band-ink); border-radius:10px; padding:0 14px; }
.strip{ display:flex; align-items:center; }
.strip .n{ width:36px; height:36px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; background:var(--surface2); color:var(--ink2); }
.strip .n .i{ width:22px; height:22px; }
.strip .n.done{ background:var(--press); color:var(--ink); }
.strip .n.cur{ background:var(--act); color:var(--act-ink); box-shadow:0 0 0 4px var(--ring); }
.strip .ln{ width:24px; height:3px; margin-inline:4px; border-radius:2px; background:var(--surface2); }
.strip .ln.done{ background:var(--ink2); }
html[data-contrast="hc"] .strip .n.done{ background:#000; color:var(--ink); }
html[data-contrast="hc"] .strip .n:not(.cur){ outline:3px solid var(--ink); outline-offset:-3px; }
.dots{ display:flex; align-items:center; gap:8px; }
.dots i{ width:16px; height:16px; border-radius:50%; background:var(--surface2); }
.dots i.on{ background:var(--ink); }
.dots i.cur{ width:24px; height:24px; background:var(--act); box-shadow:0 0 0 4px var(--ring); }
html[data-contrast="hc"] .dots i:not(.on):not(.cur){ outline:3px solid var(--ink); outline-offset:-3px; }
.top{ gap:12px; }
#topstep{ flex:0 1 auto; min-width:0; }
#topstep:empty{ display:none; }
.badge{ position:absolute; top:-14px; inset-inline-end:20px; height:26px; padding:0 8px; font-family:var(--ui); font-weight:500; font-size:24px; line-height:26px;
  color:var(--ink2); background:var(--surface2); border-radius:8px 8px 0 0; pointer-events:none; }

/* ---- main: the sentence block at a fixed y, then one hero block ---- */
.main{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:var(--gap); overflow-x:hidden; overflow-y:auto; }
.block{ display:flex; flex-direction:column; gap:8px; flex:0 0 auto; }
.block.row{ flex-direction:row; align-items:center; gap:16px; }
.block .txt{ display:flex; flex-direction:column; gap:8px; min-width:0; }
.step{ margin:0; font-weight:500; font-size:28px; line-height:1.25; color:var(--ink2); }
.say{ font-family:var(--ui); font-weight:700; font-size:calc(40px * var(--s)); line-height:1.3; margin:0; color:var(--ink); }
.say.big{ font-size:calc(48px * var(--s)); }
.say:focus{ outline:none; }
.sub{ margin:0; font-weight:500; font-size:calc(32px * var(--s)); line-height:1.3; color:var(--ink2); }
.say, .sub{ text-wrap:balance; }
.notice{ margin:0; font-weight:500; font-size:32px; background:var(--surface); box-shadow:var(--lift); border-radius:20px; padding:16px; color:var(--ink); }
.mid{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:16px; }
.mid.top{ justify-content:flex-start; }
.mid:empty{ display:none; }

/* cards: one soft elevation, never an outline */
.card{ display:flex; align-items:center; gap:16px; background:var(--surface); border-radius:20px; padding:16px 20px; box-shadow:var(--lift); }
.card > .i{ width:44px; height:44px; color:var(--act); }
html[data-contrast="hc"] .card > .i{ color:var(--ink); }
.card .txt{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.card .ini{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; flex:0 0 auto; background:var(--surface2); font-weight:700; font-size:32px; color:var(--ink); }
.card .lt{ width:56px; height:56px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; background:var(--surface2); color:var(--act); }
.card .lt .i{ width:36px; height:36px; }
html[data-contrast="hc"] .card .lt{ color:var(--ink); }
.sample{ background:var(--surface); border-radius:20px; padding:16px 20px; box-shadow:var(--lift); font-weight:700; font-size:calc(40px * var(--s)); line-height:1.3; color:var(--ink); }
.card .nm{ font-weight:700; font-size:calc(32px * var(--s)); line-height:1.25; color:var(--ink); }
.card .ds{ font-weight:500; font-size:calc(32px * var(--s)); line-height:1.3; color:var(--ink2); }
.card.hero .nm{ font-size:calc(40px * var(--s)); }
.list{ list-style:none; margin:0; padding:8px 16px; display:flex; flex-direction:column; background:var(--surface); border-radius:20px; box-shadow:var(--lift); }
.list li{ display:flex; align-items:center; gap:12px; padding-block:12px; min-height:64px; font-weight:500; font-size:calc(32px * var(--s)); line-height:1.3; color:var(--ink); }
.list li{ position:relative; }
.list li + li::before{ content:''; position:absolute; top:0; inset-inline:48px 0; height:2px; background:var(--surface2); }
.list .i{ width:36px; height:36px; margin-block-start:2px; color:var(--act); }
html[data-contrast="hc"] .card, html[data-contrast="hc"] .list, html[data-contrast="hc"] .notice{ outline:3px solid var(--ink); outline-offset:-3px; }
html[data-contrast="hc"] .list .i{ color:var(--ink); }
.okdisc{ width:72px; height:72px; border-radius:50%; display:grid; place-items:center; background:var(--yes); color:var(--yn-ink); flex:0 0 auto; }
.okdisc .i{ width:44px; height:44px; stroke-width:3; }

/* the one signature element: a white plate on a yellow band */
.band{ background:var(--band); color:var(--band-ink); border-radius:20px; padding:16px 20px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.band.row{ flex-direction:row; text-align:start; gap:20px; }
.plate{ font-family:var(--sign); font-weight:400; font-synthesis:none; font-size:120px; line-height:1; letter-spacing:-0.02em; background:var(--plate); color:var(--plate-ink); border:4px solid var(--plate-ink); border-radius:12px; padding:16px 32px 8px; min-width:1.4em; text-align:center; flex:0 0 auto; }
.plate.sm{ font-size:96px; padding:10px 22px 4px; }
html[data-contrast="hc"] .plate{ border-color:#000000; }
.band .dir{ font-weight:700; font-size:32px; line-height:1.25; white-space:nowrap; }
.band .dir .k, .band .dir .v{ display:none; }
.band.row .dir{ display:flex; flex-direction:column; }
.band.row .dir .full{ display:none; }
.band.row .dir .k{ display:block; font-weight:500; font-size:28px; }
.band.row .dir .v{ display:block; }
.band .cap{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.band .k{ font-weight:500; font-size:28px; line-height:1.2; }
.band .tag{ font-weight:700; font-size:32px; line-height:1.25; }
/* a big figure: the one hero fact */
.fig{ display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; column-gap:12px; row-gap:0; color:var(--ink); }
.fig .num{ font-family:var(--sign); font-size:96px; line-height:1; letter-spacing:-0.02em; }
.fig.sec .num{ font-size:72px; }
.fig .unit{ font-weight:700; font-size:calc(32px * var(--s)); line-height:1.2; }
.fig.md .num{ font-family:var(--ui); font-weight:800; font-size:48px; line-height:1.1; }
.fig.md{ justify-content:flex-start; }
.fig.md .soft{ margin-inline-start:12px; }
.short .b-sec span{ text-align:start; }
.fig .sep{ font-weight:700; font-size:32px; color:var(--ink2); }
.fig .soft{ font-weight:500; font-size:calc(32px * var(--s)); color:var(--ink2); }
.figcap{ margin:0; text-align:center; font-weight:500; font-size:28px; line-height:1.25; color:var(--ink2); }

/* ---- buttons: primary / yes-no / secondary surface / quiet ---- */
button{
  font-family:var(--ui); font-weight:700; font-size:32px; line-height:1.2;
  width:100%; margin:0; border:0; border-radius:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:12px; padding:8px 20px;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  text-wrap:balance; color:var(--ink); background:transparent;
}
button:focus-visible{ outline:4px solid var(--focus); outline-offset:2px; }
.b-pri, .b-yes, .b-no{ min-height:92px; font-size:32px; padding:8px 20px 12px; white-space:nowrap; box-shadow:inset 0 -4px 0 var(--edge); }
.b-pri{ background:var(--act); color:var(--act-ink); --edge:var(--act-edge); }
.b-yes{ background:var(--yes); color:var(--yn-ink); --edge:var(--yes-edge); }
.b-no{ background:var(--no); color:var(--yn-ink); --edge:var(--no-edge); }
.b-pri:active, .b-yes:active, .b-no:active, .mic:active{ box-shadow:inset 0 -1px 0 var(--edge); padding-block:11px 9px; }
.b-sec{ min-height:76px; background:var(--surface2); color:var(--ink); white-space:nowrap; }
.b-sec:active, .tile:active, .opt:active, .who button:active{ background:var(--press); }
.b-quiet:active{ background:var(--surface2); }
.b-quiet{ min-height:72px; font-weight:500; font-size:30px; color:var(--ink); text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:7px; padding-block:4px; }
.b-quiet .i{ width:32px; height:32px; }
html[data-contrast="hc"] .b-sec, html[data-contrast="hc"] .opt, html[data-contrast="hc"] .who button{ outline:3px solid var(--ink); outline-offset:-3px; }
.actions{ flex:0 0 auto; display:flex; flex-direction:column; gap:16px; }
.actions:empty{ display:none; }
.opts{ display:flex; gap:16px; }
.opts button{ flex:1 1 0; min-height:92px; font-size:32px; }
.opt{ background:var(--surface2); color:var(--ink); }
.opt .slot{ width:36px; height:36px; flex:0 0 auto; }
.opt[aria-pressed="true"]{ background:var(--act); color:var(--act-ink); box-shadow:inset 0 -4px 0 var(--act-edge); }
.who{ display:flex; gap:16px; }
.who button{ flex:1 1 0; min-height:min(160px, 19dvh); font-size:48px; background:var(--surface); box-shadow:var(--lift); border-radius:20px; }

/* ---- footer: one calm bar, two equal tiles ---- */
.foot{
  position:relative; flex:0 0 auto; display:flex; flex-direction:column; gap:0;
  margin-inline:calc(-1 * (var(--pad) + env(safe-area-inset-left))) calc(-1 * (var(--pad) + env(safe-area-inset-right)));
  padding:12px calc(var(--pad) + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-left));
  background:var(--surface2);
}
html[data-contrast="hc"] .foot{ border-top:3px solid var(--ink); }
.tiles{ display:flex; gap:16px; }
.tiles #again:only-child, .tiles:has(#lost[hidden]) #again{ flex:0 0 calc(50% - 8px); }
.tile{ flex:1 1 0; min-width:0; min-height:88px; flex-direction:column; gap:4px; padding:8px 6px; border-radius:16px; background:var(--surface); color:var(--ink); font-weight:500; font-size:30px; line-height:1.1; white-space:nowrap; }
.tile .i{ width:32px; height:32px; }
.tile.amber{ box-shadow:inset 0 4px 0 var(--amber-edge); }
.tile .disc{ width:40px; height:40px; margin-block:-4px; border-radius:50%; display:grid; place-items:center; background:var(--amber); color:#1A1814; }
.tile .disc .i{ width:28px; height:28px; }
html[data-contrast="hc"] .tile{ outline:3px solid var(--ink); outline-offset:-3px; }
.quietbox:empty{ display:none; }

/* ---- microphone + text field ---- */
.mic{
  --d:min(160px, 20dvh); --edge:var(--act-edge);
  width:var(--d); height:var(--d); min-height:72px; border-radius:50%; align-self:center; flex:0 0 auto;
  flex-direction:column; gap:4px; padding:8px 8px 12px; background:var(--act); color:var(--act-ink);
  box-shadow:inset 0 -4px 0 var(--edge);
}
.mic .i{ width:44px; height:44px; }
.inrow{ display:flex; gap:12px; align-items:stretch; }
.inrow .field{ flex:1 1 auto; min-width:0; height:auto; min-height:88px; }
.inrow .mic{ width:104px; height:auto; min-height:88px; border-radius:18px; align-self:stretch; }
.inrow .mic .i{ width:36px; height:36px; }
.mid.tight .mic:not(.inrow .mic){ width:100%; height:auto; min-height:76px; border-radius:18px; flex-direction:row; gap:12px; }
.mic.listening{ animation:pulse 2s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ box-shadow:inset 0 -4px 0 var(--edge), 0 0 0 0 rgba(11,61,145,.45); } 50%{ box-shadow:inset 0 -4px 0 var(--edge), 0 0 0 22px rgba(11,61,145,0); } }
.field{
  width:100%; height:76px; flex:0 0 auto;
  font-family:var(--ui); font-weight:500; font-size:calc(36px * var(--s));
  color:var(--ink); background:var(--surface); box-shadow:var(--lift), inset 0 0 0 2px var(--surface2);
  border:0; border-radius:16px; padding-inline:20px;
}
.field::placeholder{ color:var(--placeholder); opacity:1; }
html[data-contrast="hc"] .field{ outline:3px solid var(--ink); outline-offset:-3px; }
html[data-contrast="hc"] .field::placeholder{ color:#FFE14D; }
.field:focus{ outline:4px solid var(--focus); outline-offset:2px; }
.short{ display:flex; flex-direction:column; gap:12px; }
.short .b-sec{ justify-content:flex-start; background:var(--surface); box-shadow:var(--lift); }
.short .b-sec .i{ color:var(--act); }
html[data-contrast="hc"] .short .b-sec .i{ color:var(--ink); }

/* calm progress bar */
.bar{ height:16px; border-radius:8px; overflow:hidden; background:var(--surface2); }
.waitcap{ margin:0; font-weight:500; font-size:32px; color:var(--ink2); }
html[data-contrast="hc"] .bar{ outline:3px solid var(--ink); outline-offset:-3px; }
.bar i{ display:block; height:100%; width:10%; min-width:16px; background:var(--act); transition:width 8s linear; }

/* map — big enough to read, still secondary */
.map{ position:relative; flex:1 1 auto; min-height:200px; border-radius:20px; overflow:hidden; background:var(--surface2); box-shadow:var(--lift); }
html[data-contrast="hc"] .map{ outline:3px solid var(--ink); outline-offset:-3px; }
.map svg{ position:absolute; inset:0; width:100%; height:100%; }
#map{ position:absolute; inset:0; direction:ltr; background:transparent; }
#map.leaflet-container{ background:var(--surface2); font-family:var(--ui); }
.leaflet-control-attribution{ font-size:11px !important; line-height:1.3 !important; background:rgba(255,255,255,.8) !important; }
.leaflet-tile-pane{ filter:saturate(.35) contrast(.95) brightness(1.04); }
.lf-icon{ background:none; border:0; }
.me-dot{ position:absolute; width:30px; height:30px; left:-15px; top:-15px; border-radius:50%; background:#0B3D91; border:5px solid #FFFFFF; box-shadow:0 0 0 3px #0B3D91; }
.lbl{ position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap; direction:rtl;
  font-family:var(--ui); font-weight:700; font-size:32px; line-height:1.2; background:#FFFFFF; color:#1A1814; border-radius:8px; padding:2px 12px;
  box-shadow:0 1px 2px rgba(26,24,20,.25), 0 4px 12px rgba(26,24,20,.18); }
.me-lbl{ top:24px; }
.pin-head{ position:absolute; width:40px; height:40px; left:-20px; top:-52px; background:#B00020; border:5px solid #FFFFFF; border-radius:50% 50% 50% 0; transform:rotate(-45deg); box-shadow:0 2px 6px rgba(0,0,0,.3); }
.pin-lbl{ bottom:60px; }

/* the only alert: flashing signage yellow / black, until "הבנתי" */
.alert{
  position:fixed; inset:0; z-index:1000;
  display:flex; flex-direction:column; justify-content:center; align-items:center; gap:32px;
  padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  background:#FFD400; color:#000000; text-align:center;
  animation:flash 1s steps(1, end) infinite;
}
.alert p{ margin:0; text-wrap:balance; }
.alert .i{ width:120px; height:120px; stroke-width:2; }
.alert .big{ font-family:var(--ui); font-weight:800; font-size:56px; line-height:1.2; }
.alert .where{ font-family:var(--ui); font-weight:700; font-size:clamp(32px, 9.2vw, calc(40px * var(--s))); line-height:1.25; }
.alert button{ min-height:120px; font-size:48px; font-weight:800; border:4px solid currentColor; border-radius:20px; animation:flashb 1s steps(1, end) infinite; }
.alert button:focus{ outline:none; }
.alert button:focus-visible{ outline:6px solid currentColor; outline-offset:4px; }
.alert.still, .alert.still button{ animation:none; }
.alert.still button{ background:#000000; color:#FFD400; border-color:#000000; }
@keyframes flash{ 0%{ background:#FFD400; color:#000000; } 50%{ background:#000000; color:#FFD400; } }
@keyframes flashb{ 0%{ background:#000000; color:#FFD400; border-color:#000000; } 50%{ background:#FFD400; color:#000000; border-color:#FFD400; } }
@media (prefers-reduced-motion: reduce){
  .alert, .alert button{ animation-duration:2s; }   /* safety signal: slower (0.5 Hz), never off */
  .mic.listening{ animation:none; }
  .bar i{ transition:none; }
}
/* ?frame=1 desktop presentation */
body.pf{ overflow:hidden; background:#E9E2D3; }
.pf-stage{ height:100dvh; display:grid; place-items:center; }
.pf-phone{ position:relative; width:436px; height:939px; padding:12px; border-radius:44px; background:#141414;
  box-shadow:0 0 0 2px #2A2A2A, 0 24px 60px rgba(40,30,10,.28); transform:scale(var(--pfk, 1)); transform-origin:center; }
.pf-cam{ position:absolute; top:26px; left:50%; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:#000; box-shadow:0 0 0 3px #222; z-index:2; }
.pf-screen{ display:block; width:412px; height:915px; border:0; border-radius:32px; background:#F7F3EC; }
/* short phones: tighter rhythm (16), smaller plate, sign card side by side */
@media (max-height: 860px){
  :root{ --gap:16px; }
  .b-pri, .b-yes, .b-no{ min-height:80px; }
  .b-sec{ min-height:72px; }
  .card{ padding:12px 16px; }
  .list{ padding:4px 16px; }
  .list li{ padding-block:8px; }
  .okdisc{ width:60px; height:60px; }
  .say.big{ font-size:calc(44px * var(--s)); }
  .card.hero .nm{ font-size:calc(36px * var(--s)); }
  .plate{ font-size:96px; padding:12px 26px 6px; }
  .band:not(.solo){ flex-direction:row; text-align:start; gap:20px; padding:12px 16px; }
  .band:not(.solo) .dir{ display:flex; flex-direction:column; }
  .band:not(.solo) .dir .full{ display:none; }
  .band:not(.solo) .dir .k{ display:block; font-weight:500; font-size:28px; }
  .band:not(.solo) .dir .v{ display:block; }
  .fig .num{ font-size:80px; }
  .fig.sec .num{ font-size:64px; }
  .fig.md .num{ font-size:44px; }
  .top{ height:48px; }
}
/* 360×780-class phones: a 12px rhythm */
@media (max-height: 800px){
  :root{ --gap:12px; }
  .block, .block .txt{ gap:4px; }
  .say{ line-height:1.25; }
  .card.hero .nm{ font-size:calc(32px * var(--s)) !important; }
  .mid{ gap:12px; }
  .actions{ gap:12px; }
  .foot{ padding-block-start:10px; }
  .map{ min-height:150px; }
  .tiles{ gap:12px; }
  .badge{ top:-11px; height:22px; line-height:22px; }
  .tiles #again:only-child, .tiles:has(#lost[hidden]) #again{ flex:0 0 calc(50% - 6px); }
  .notice{ padding:8px 12px; }
  .list li{ padding-block:4px; }
  .card{ padding:10px 16px; }
}

<script>
'use strict';
/* ============================================================
   לאן? — one instruction at a time, voice + text, nothing silent.
   ============================================================ */
const Q = new URLSearchParams(location.search);
const SHOT = (Q.get('screen') || '').trim();      // ?screen=<id>: one screen, demo data, frozen
const DEMO = Q.get('demo') === '1' || !!SHOT;
const AUTO = DEMO && !SHOT && Q.get('auto') === '1';
const LOSTSIM = DEMO && !SHOT && Q.get('lost') === '1';   // the walk drifts 120 m off the path midway
const SPEED = Math.min(8, Math.max(0.25, parseFloat(Q.get('speed')) || 1));
const D = ms => ms / SPEED;
const MINUTE = (DEMO && !SHOT) ? 2000 / SPEED : 60000;    // demo: 1 simulated minute = 2 s
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* numbers (and phone numbers) are isolated so they never flip the Hebrew around them */
const UNIT = /(\d)\s(מטר|דקות|דקה|תחנות|תחנה|קילומטר)/g;
const fmt = s => String(s == null ? '' : s).replace(UNIT, '$1\u00A0$2').split(/(\d[\d\-\u2011.,:]*\d|\d)/)
  .map((part, i) => i % 2 ? '<bdi>' + esc(part) + '</bdi>'
    : esc(part).replace(/\s*\/\s*/g, '\u2009/\u2009').replace(/־/g, '־\u2060')).join('');
/* a proper name: its words never part (only the " / " between street names may break) */
const nm = s => String(s || '').replace(/\s*\/\s*/g, '/').split('/').map(x => x.trim().replace(/ /g, '\u00A0')).join(' / ');
const shortName = s => { let x = String(s || '').split(',')[0].trim(); if (x.length > 14) x = x.split(' ').slice(0, 2).join(' '); return x; };
const ic = (n, c) => `<svg class="i${c ? ' ' + c : ''}" aria-hidden="true" focusable="false"><use href="#i-${n}"/></svg>`;

/* ---------- optional host bridge (Claude-hosted Artifact) ---------- */
const H = () => (window.LaanHost && typeof window.LaanHost === 'object') ? window.LaanHost : null;
let STATIC_NO_SERVER = /github\.io$/i.test(location.hostname);   // GitHub Pages: no server.py there
const noServer = () => STATIC_NO_SERVER || !!(H() && H().noServer === true);
async function hostCall(name, ...args){
  const h = H(); if (!h || typeof h[name] !== 'function') return null;
  try { const r = await Promise.race([Promise.resolve(h[name](...args)), sleep(9000).then(() => null)]); return r || null; }
  catch (e) { return null; }
}

/* ---------- FALLBACK_ROUTE ----------
   APPROXIMATE coordinates along Dizengoff St, Tel Aviv — hand-placed for the demo and
   for silent fallback, not surveyed. Line 5 (Dan) northbound toward Reading. */
const FALLBACK = {
  start: { lat: 32.0753, lon: 34.7752 },
  dest:  { name: 'מרפאת כללית, דיזנגוף', lat: 32.0895, lon: 34.7732 },
  line: '5', headsign: 'רידינג', headsignBack: 'התחנה המרכזית', departs_in_min: 6,
  stops: [
    { name: "דיזנגוף/קינג ג'ורג'",  lat: 32.0762, lon: 34.7748 },
    { name: 'דיזנגוף/בוגרשוב',     lat: 32.0775, lon: 34.7746 },
    { name: 'דיזנגוף/פרישמן',      lat: 32.0810, lon: 34.7735 },
    { name: 'דיזנגוף/גורדון',       lat: 32.0830, lon: 34.7730 },
    { name: 'דיזנגוף/ארלוזורוב',    lat: 32.0870, lon: 34.7720 },
    { name: "דיזנגוף/ז'בוטינסקי",   lat: 32.0890, lon: 34.7715 }
  ],
  walkTo: [[32.0753, 34.7752], [32.0755, 34.7760], [32.0764, 34.7756], [32.0762, 34.7748]]
};
/* demo "what is around me" (spec round 2, §A) */
const DEMO_NEARBY = [
  { name: 'סופר־פארם דיזנגוף', kind_he: 'בית מרקחת', dist: 25 },
  { name: 'בנק לאומי', kind_he: 'בנק', dist: 40 },
  { name: 'כיכר דיזנגוף', kind_he: 'כיכר', dist: 90 }
];

/* ---------- storage ----------
   real mode: localStorage. ?demo=1: settings only in memory, the journey in sessionStorage.
   ?screen=: nothing is read or written at all. */
const KEY_SET = 'laan.settings';
const KEY_J = DEMO ? 'laan.demo.journey' : 'laan.journey';
function bucket(){ if (SHOT) return null; try { return DEMO ? window.sessionStorage : window.localStorage; } catch (e) { return null; } }
function sget(k){ try { const b = bucket(); const s = b && b.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function sset(k, v){ try { const b = bucket(); if (b) b.setItem(k, JSON.stringify(v)); } catch (e) {} }
function sdel(k){ try { const b = bucket(); if (b) b.removeItem(k); } catch (e) {} }

const DEFAULTS = { done:false, gender:'m', home:null, contact:null, contactName:'', size:'l', contrast:'normal',
                   voice:true, rate:0.85, noVoiceShown:false, recent:[], visits:0 };
let settings = DEMO
  ? Object.assign({}, DEFAULTS, {
      done: true, gender: Q.get('g') === 'f' ? 'f' : 'm',
      voice: SHOT ? Q.get('voice') === '1' : true,
      size: Q.get('size') === 'xl' ? 'xl' : 'l', contrast: Q.get('theme') === 'hc' ? 'hc' : 'normal', visits: 1,
      contact: Q.get('nocontact') === '1' ? null : '050-1234567', contactName: Q.get('nocontact') === '1' ? '' : 'רותי' })   // demo-only sample contact, never stored
  : Object.assign({}, DEFAULTS, sget(KEY_SET) || {});
if (!Array.isArray(settings.recent)) settings.recent = [];
const saveSettings = () => { if (!DEMO) sset(KEY_SET, settings); };   // demo never writes settings
let journey = SHOT ? null : sget(KEY_J);
const saveJourney = () => { if (journey) sset(KEY_J, journey); };

/* ---------- all copy lives here: masculine / feminine ---------- */
const g = (m, f) => settings.gender === 'f' ? f : m;
const FAMILY = /^ה(בת|בן|נכד|נכדה|אישה|בעל|שכן|שכנה|אח|אחות|חבר|חברה|מטפל|מטפלת)(\s|$)/;
function lName(n){                     // "רותי" → "לרותי", "הבת שלי" → "לבת שלי", "050…" → "ל־050…"
  n = String(n || '').trim(); if (!n) return '';
  if (FAMILY.test(n)) return 'ל' + n.slice(1);
  return /^[א-ת]/.test(n) ? 'ל' + n : 'ל־' + n;
}
const contactName = () => (settings.contactName || '').trim() || (settings.contact || '').trim();
const STR = {

  welcomeCap: () => 'הוראה אחת בכל\u00A0פעם',
  start:      () => 'בואו נתחיל',

/* ---------- geometry ---------- */
function dist(a, b){
  const R = 6371000, rad = Math.PI / 180;
  const la1 = (a.lat != null ? a.lat : a[0]) * rad, la2 = (b.lat != null ? b.lat : b[0]) * rad;
  const lo1 = (a.lon != null ? a.lon : a[1]) * rad, lo2 = (b.lon != null ? b.lon : b[1]) * rad;
  const x = Math.sin((la2 - la1) / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin((lo2 - lo1) / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
const P = o => [o.lat, o.lon];
function pathLen(path){ let s = 0; for (let i = 1; i < path.length; i++) s += dist(path[i - 1], path[i]); return s; }
function along(path, f){
  const total = pathLen(path); let target = f * total;
  for (let i = 1; i < path.length; i++){
    const seg = dist(path[i - 1], path[i]);
    if (target <= seg || i === path.length - 1){
      const k = seg ? Math.min(1, target / seg) : 1;
      return { lat: path[i - 1][0] + (path[i][0] - path[i - 1][0]) * k, lon: path[i - 1][1] + (path[i][1] - path[i - 1][1]) * k };
    }
    target -= seg;
  }
  return { lat: path[0][0], lon: path[0][1] };
}
function pathFrom(path, pos){
  if (!pos) return path;
  let best = 0, bd = Infinity;
  path.forEach((p, i) => { const d = dist(p, pos); if (d < bd){ bd = d; best = i; } });
  const rest = path.slice(best + 1);
  return rest.length ? [P(pos)].concat(rest) : [P(pos), path[path.length - 1]];
}
/* shortest distance from a point to a polyline, in metres (local flat projection) */
function distToPath(pos, path){
  if (!path || !path.length) return 0;
  const lat0 = pos.lat * Math.PI / 180, kx = 111320 * Math.cos(lat0), ky = 110540;
  const xy = p => [(p[1] - pos.lon) * kx, (p[0] - pos.lat) * ky];
  if (path.length === 1){ const a = xy(path[0]); return Math.hypot(a[0], a[1]); }
  let best = Infinity;
  for (let i = 1; i < path.length; i++){
    const a = xy(path[i - 1]), b = xy(path[i]);
    const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
    const k = L2 ? Math.max(0, Math.min(1, -(a[0] * dx + a[1] * dy) / L2)) : 0;
    best = Math.min(best, Math.hypot(a[0] + k * dx, a[1] + k * dy));
  }

function detour(path, off){
  const half = pathLen(path) / 2;

  for (let i = 1; i < path.length; i++){
    const seg = dist(path[i - 1], path[i]);
    if (acc + seg >= half){
      const k = seg ? (half - acc) / seg : 0, a = path[i - 1], b = path[i];
      const M = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
      const cos = Math.cos(M[0] * Math.PI / 180);
      const vx = (b[1] - a[1]) * 111320 * cos, vy = (b[0] - a[0]) * 110540, L = Math.hypot(vx, vy) || 1;

async function api(method, url, body, timeout){

  const tm = setTimeout(() => { try { ctl && ctl.abort(); } catch (e) {} }, timeout || 6000);
  try {
    const r = await fetch(url, {
      method, cache: 'no-store', signal: ctl ? ctl.signal : undefined,
      headers: body ? { 'content-type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined

    if (!r.ok) return { ok: false };

    .replace(/\//g, ' פינת ').replace(/[()]/g, ', ').replace(/[✓✗—·]/g, ' ')

async function askPerms(){
  if (DEMO) return;
  await new Promise(res => {
    const done = setTimeout(res, 25000);
    try {
      navigator.geolocation.getCurrentPosition(
        p => { S.pos = { lat: p.coords.latitude, lon: p.coords.longitude }; S.acc = p.coords.accuracy; clearTimeout(done); res(); },
        e => { if (e && e.code === 1) S.geoDenied = true; clearTimeout(done); res(); }, { enableHighAccuracy: true, timeout: 20000 });
    } catch (e) { clearTimeout(done); res(); }
  });
  try {
    if (!(H() && H().dictation) && SR() && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      const st = await Promise.race([navigator.mediaDevices.getUserMedia({ audio: true }), sleep(25000).then(() => null)]);
      if (st) st.getTracks().forEach(tr => tr.stop());
    }
  } catch (e) { /* refused: the keyboard field is always there */ }
}

/* ============================================================

const SR = () => window.SpeechRecognition || window.webkitSpeechRecognition;
const canListen = () => DEMO || (!S.micBlocked && (!!(H() && H().dictation) || !!SR()));
const DEMO_TEXT = { dest: 'קופת חולים בדיזנגוף', home: "קינג ג'ורג' 20, תל אביב", lost: 'סופר פארם' };
function screenDest(prefill){ S.homeCtx = null; placeScreen('dest', prefill); }

function setListening(on){
  const mic = $('mic');
  if (mic) mic.classList.toggle('listening', on);
  if (on){ $('say').innerHTML = fmt(t('listening')); $('sub').hidden = true; }
}
function demoFill(mode){
  const f = $('field'); if (!f) return;
  setListening(false);
  f.value = DEMO_TEXT[mode] || DEMO_TEXT.dest;
  f.dispatchEvent(new Event('input'));
  if (mode === 'lost') lostSubmit(f.value); else submitPlace(mode, f.value);
}
function stopListening(){
  if (!S.rec) return;
  try { S.rec.abort ? S.rec.abort() : S.rec.stop(); } catch (e) {}
  S.rec = null;
}
/* one listening helper: the host's dictation if it has one, else the browser's */
function listen(onText){
  try { speechSynthesis.cancel(); } catch (e) {}
  const host = H() && H().dictation;
  if (host && typeof host.start === 'function'){
    let got = false;
    S.rec = { stop(){ try { host.stop(); } catch (e) {} }, abort(){ try { host.stop(); } catch (e) {} } };
    setListening(true);
    try {
      host.start(txt => { got = true; S.rec = null; setListening(false); txt = String(txt || '').trim(); if (txt) onText(txt); else setSay(t('noSpeech'), t('noSpeechSub'), true); },
        st => {
          if (st === 'listening') setListening(true);
          else if (/denied|not-allowed/.test(String(st))){ S.rec = null; setListening(false); S.micBlocked = true; const m = $('mic'); if (m) m.hidden = true; setSay(t('noMic'), t('writeHere'), true); }
          else if (/error|end|idle|stopped/.test(String(st)) && !got){ S.rec = null; setListening(false); if (!S.busy) setSay(t('noSpeech'), t('noSpeechSub'), true); }
        });
    } catch (e) { S.rec = null; setListening(false); }
    return;
  }
  const Rec = SR(); if (!Rec) return;
  let got = false, failed = false;
  const r = new Rec();
  r.lang = 'he-IL'; r.interimResults = false; r.continuous = false; r.maxAlternatives = 1;
  S.rec = r;
  r.onresult = e => {
    got = true;
    const txt = (e.results && e.results[0] && e.results[0][0] && e.results[0][0].transcript || '').trim();
    if (txt) onText(txt);
  };
  r.onerror = e => {
    failed = true; setListening(false);
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      S.micBlocked = true; const m = $('mic'); if (m) m.hidden = true;
      setSay(t('noMic'), t('writeHere'), true);
    } else if (e.error === 'network' || e.error === 'audio-capture'){
      setSay(t('netMic'), t('writeHere'), true);
    } else if (e.error !== 'aborted'){
      setSay(t('noSpeech'), t('noSpeechSub'), true);
    }
  };
  r.onend = () => {
    S.rec = null; setListening(false);
    if (!got && !failed && !S.busy) setSay(t('noSpeech'), t('noSpeechSub'), true);
  };
  try { r.start(); setListening(true); } catch (e) { S.rec = null; setListening(false); }
}
function homeSkip(){
  if (S.homeCtx === 'onboard') return screenContact('onboard');
  if (S.homeCtx === 'settings') return screenSettings(5);
  return screenArrived();

async function submitPlace(mode, text){
  if (S.busy || !text) return;
  S.busy = true; S.lastText = text;
  stopListening();
  const screen = S.screen;
  setListening(false);
  setSay(t('checking'), null, true);
  const r = await resolvePlace(text, mode);
  S.busy = false;
  if (S.screen !== screen) return;
  if (r.status === 'notfound'){ setSay(t('notFound'), t('notFoundSub'), true); return; }
  screenConfirm(r.place, mode);
}
async function getCity(){
  if (S.city !== null) return S.city;
  if (!S.pos) return '';
  const r = await api('GET', `api/reverse?lat=${S.pos.lat}&lon=${S.pos.lon}`, null, 2500);
  S.city = (r.ok && r.city) || '';
  return S.city;
}
const hasLatin = s => /[A-Za-z]/.test(s || '');
function ownWords(text){
  return String(text || '')
    .replace(/^\s*(אני\s+)?(צריך|צריכה|רוצה)\s+(להגיע|לנסוע|ללכת)\s+(אל\s+|ל־?)?/, '')
    .replace(/^\s*(תביא|תביאי|קח|קחי)\s+אותי\s+(אל\s+|ל־?)?/, '')
    .replace(/\s*בבקשה\s*/g, ' ').replace(/\s+/g, ' ').trim() || String(text || '').trim();
}
function placeName(modelName, text){
  if (modelName && !hasLatin(modelName)) return modelName;
  const own = ownWords(text);
  return hasLatin(own) ? 'המקום שביקשת' : own;
}
async function resolvePlace(text, mode){
  const t0 = Date.now();
  if (DEMO){
    await sleep(D(600));
    if (mode === 'home') return { status: 'ok', place: { name: 'הבית', lat: FALLBACK.start.lat, lon: FALLBACK.start.lon } };
    return { status: 'ok', place: Object.assign({}, FALLBACK.dest) };
  }
  let query = text, name = '';
  const city = await getCity();
  const hu = await hostCall('understand', text, city);
  if (hu && hu.query){ query = hu.query; name = hu.display_name || ''; }
  else {
    const c = await api('POST', 'api/destination', { text, city }, 4000);
    if (c.ok && c.query){ query = c.query; name = c.display_name || ''; }
  }
  if (noServer()) return { status: 'ok', place: Object.assign({}, FALLBACK.dest, name && !hasLatin(name) ? { name } : {}) };
  const left = Math.max(2000, 8000 - (Date.now() - t0));
  const near = S.pos ? `&lat=${S.pos.lat}&lon=${S.pos.lon}` : '';
  const geo = await api('GET', `api/geocode?q=${enc(query)}${near}`, null, left);
  if (geo.ok && geo.found) return { status: 'ok', place: { name: placeName(name, text), lat: geo.lat, lon: geo.lon } };
  if (geo.ok && geo.found === false) return { status: 'notfound' };
  return { status: 'ok', place: Object.assign({}, FALLBACK.dest) };
}
function screenConfirm(place, mode){

  render({

function saveHome(place){
  settings.home = { name: place.name, lat: place.lat, lon: place.lon }; saveSettings();
  if (S.homeCtx === 'onboard') return screenContact('onboard');
  if (S.homeCtx === 'settings') return screenSettings(5);
  if (S.homeCtx === 'arrival') return planJourney(settings.home);

/* ============================================================
   Planning: direct line only, every step falls back silently
   ============================================================ */
function fallbackPlan(dest){
  const fwd = dist(dest, FALLBACK.dest) <= dist(dest, FALLBACK.start);
  const list = fwd ? FALLBACK.stops.slice() : FALLBACK.stops.slice().reverse();
  return {
    line: FALLBACK.line, headsign: fwd ? FALLBACK.headsign : FALLBACK.headsignBack,
    origin_stop: list[0], stops: list.slice(1), dest_stop: list[list.length - 1],
    departs_in_min: FALLBACK.departs_in_min, fallback: true
  };
}
function currentPos(timeout){
  if (S.pos) return Promise.resolve(S.pos);
  return freshFix(timeout, 30000);
}
function freshFix(timeout, maxAge){
  return new Promise(res => {
    let over = false;
    const tm = setTimeout(() => { over = true; res(null); }, timeout);
    try {
      navigator.geolocation.getCurrentPosition(
        p => { if (over) return; clearTimeout(tm); S.pos = { lat: p.coords.latitude, lon: p.coords.longitude }; S.acc = p.coords.accuracy; res(S.pos); },
        () => { if (!over){ clearTimeout(tm); res(null); } }, { enableHighAccuracy: true, maximumAge: maxAge || 0, timeout });
    } catch (e) { clearTimeout(tm); res(null); }
  });
}
async function walkPath(a, b, timeout){
  const straight = () => ({ meters: Math.round(dist(a, b)), path: [P(a), P(b)] });
  if (DEMO || !a || !b || noServer()){
    if (a && b && dist(a, FALLBACK.start) < 15 && dist(b, FALLBACK.stops[0]) < 15)
      return { meters: Math.round(pathLen(FALLBACK.walkTo)), path: FALLBACK.walkTo.slice() };
    return a && b ? straight() : { meters: 0, path: [] };
  }
  const r = await api('GET', `api/walk?from=${a.lat},${a.lon}&to=${b.lat},${b.lon}`, null, timeout);
  if (r.ok && Array.isArray(r.path) && r.path.length > 1) return { meters: Math.round(r.meters || pathLen(r.path)), path: r.path };
  return straight();
}
function screenPlanning(){
  render({
    name: 'planning', step: STEP.plan, say: t('planning'), sub: t('planningSub'), midClass: 'top',
    mid: '<div class="bar" role="progressbar" aria-label="מחפש"><i id="barfill"></i></div>' + `<p class="waitcap">${esc(t('planningCap'))}</p>`,
    after(){ requestAnimationFrame(() => requestAnimationFrame(() => { const b = $('barfill'); if (b) b.style.width = SHOT ? '60%' : '100%'; })); }
  });
}
function rememberRecent(dest){
  if (settings.home && dist(dest, settings.home) < 30) return;
  const item = { name: dest.name, lat: dest.lat, lon: dest.lon };
  settings.recent = [item].concat(settings.recent.filter(r => r.name !== item.name)).slice(0, 3);
  saveSettings();
}
async function planJourney(dest){
  if (S.busy) return; S.busy = true;
  SIM.stop();
  rememberRecent(dest);
  S.planFor = dest;
  screenPlanning();
  const t0 = Date.now();
  const origin = DEMO ? (S.pos || FALLBACK.start) : ((await currentPos(3000)) || FALLBACK.start);
  const span = dist(origin, dest);
  if (span > 25000){ S.busy = false; return screenTooFar(); }
  if (span < 400){ S.busy = false; return screenTooClose(dest, origin); }
  let plan = null;
  if (!DEMO){
    const r = await api('GET', `api/plan?olat=${origin.lat}&olon=${origin.lon}&dlat=${dest.lat}&dlon=${dest.lon}`, null, 6000);
    if (r.ok && r.origin_stop && Array.isArray(r.stops) && r.stops.length){
      plan = { line: String(r.line || ''), headsign: r.headsign || '', origin_stop: r.origin_stop, stops: r.stops,
               dest_stop: r.dest_stop || r.stops[r.stops.length - 1], departs_in_min: Math.max(1, r.departs_in_min || 1) };
    } else if (r.reason === 'no-direct'){
      S.busy = false;
      if (S.overlay){ S.lastBase = () => screenNoDirect(dest); return; }
      return screenNoDirect(dest);
    }
  }
  if (!plan) plan = fallbackPlan(dest);
  if (plan.departs_in_min > 90){ S.busy = false; return screenNoService(plan.departs_in_min); }
  const left = Math.max(1500, 8000 - (Date.now() - t0));
  const [wt, wf] = await Promise.all([walkPath(origin, plan.origin_stop, left), walkPath(plan.dest_stop, dest, left)]);
  if (DEMO) await sleep(Math.max(0, D(1000) - (Date.now() - t0)));
  journey = {
    dest: { name: dest.name, lat: dest.lat, lon: dest.lon }, plan, origin: { lat: origin.lat, lon: origin.lon },
    walkTo: wt, walkFrom: wf, step: 'walk', walking: false, passedIdx: -1, startedAt: Date.now(),
    departsAt: DEMO ? null : Date.now() + plan.departs_in_min * MINUTE, alert: null, minDest: null, lastPos: null
  };
  S.off = null;
  saveJourney();
  S.busy = false;
  if (S.overlay){ S.lastBase = screenWalk; return; }
  screenWalk();
}
function screenNoDirect(dest){

/* ---------- position: one handler for GPS and the demo simulator ---------- */
function onPos(lat, lon, acc){
  S.pos = { lat, lon }; S.acc = acc;
  updateMe();
  if (!journey || S.paused) return;
  if (Date.now() - S.lastPosSave > 2000 && ['walk', 'ride', 'finalwalk'].includes(journey.step)){
    S.lastPosSave = Date.now(); journey.lastPos = { lat, lon }; saveJourney();
  }
  if (acc > 60){
    if (!DEMO && ['walk', 'finalwalk', 'stop'].includes(journey.step) && !S.overlay){
      S.weakSince = S.weakSince || Date.now();
      if (Date.now() - S.weakSince > 30000 && !journey['weak_' + journey.step]){ journey['weak_' + journey.step] = true; saveJourney(); caseGpsWeak(); }
    }
    return;
  }
  S.weakSince = 0;
  const pos = S.pos;
  if (journey.step === 'walk'){
    const d = dist(pos, journey.plan.origin_stop);
    if (S.screen === 'walk' && journey.walking){ const w = $('walkfig'); if (w) w.innerHTML = walkFig(d < 50 ? 0 : round50(d)); }
    if (d <= 30 && S.screen === 'walk') return toStop();
    checkOffRoute(pos, acc);
  } else if (journey.step === 'ride'){
    rideProgress(pos);
  } else if (journey.step === 'finalwalk'){
    if (dist(pos, journey.dest) <= 30 && S.screen === 'finalwalk') return toArrived();
    if (S.screen === 'finalwalk'){ const w = $('walkfig'); const dd = dist(pos, journey.dest); if (w) w.innerHTML = walkFig(dd < 50 ? 0 : round50(dd), walkMinutes(dd)); }
    checkOffRoute(pos, acc);
  }
}
function rideProgress(pos){
  const stops = journey.plan.stops, last = stops.length - 1;
  let changed = false;
  for (let i = journey.passedIdx + 1; i < stops.length; i++){
    if (dist(pos, stops[i]) <= 40){ journey.passedIdx = i; changed = true; }
  }
  const dd = dist(pos, stops[last]);
  journey.minDest = journey.minDest == null ? dd : Math.min(journey.minDest, dd);
  if (changed){
    saveJourney();
    if (journey.passedIdx >= last){ if (!S.alertOn) toOff(); return; }
    if (S.screen === 'ride') screenRide();
    return;
  }
  const offLine = distToPath(pos, [P(journey.plan.origin_stop)].concat(stops.map(P)));
  if (offLine > 300 && !S.alertOn && S.screen === 'ride'){
    S.rideOff = (S.rideOff || 0) + 1;
    if (S.rideOff >= 3){
      S.rideOff = 0;
      if (journey.passedIdx < 0 && !journey.wrongShown){ journey.wrongShown = true; saveJourney(); return caseWrongBus(); }
      if (journey.passedIdx >= 0 && !journey.detourShown){ journey.detourShown = true; saveJourney(); return caseDetour(); }
    }
  } else S.rideOff = 0;
  if (journey.passedIdx < last && journey.minDest < 200 && dd > journey.minDest + 150 && !S.alertOn && S.screen === 'ride'){
    SIM.stop(); journey.step = 'passed'; saveJourney(); screenPassed();
  }
}
/* off the walking path: > 60 m from the line, or 40 m further from the target than the closest point
   reached — for 3 good fixes in a row (≥ 4 s apart) or 45 s. Never more often than every 3 minutes. */
function checkOffRoute(pos, acc){
  if (!journey || S.overlay || S.alertOn || acc > 60) return;
  const st = journey.step;
  if (!((st === 'walk' && journey.walking) || st === 'finalwalk')) return;
  if (S.screen !== 'walk' && S.screen !== 'finalwalk') return;
  const now = Date.now();
  if (now < S.offQuietUntil) return;
  const path = st === 'walk' ? journey.walkTo.path : journey.walkFrom.path;
  const target = st === 'walk' ? journey.plan.origin_stop : journey.dest;
  const dT = dist(pos, target);
  if (!S.off || S.off.step !== st) S.off = { step: st, minT: dT, n: 0, since: 0, lastAt: 0 };
  const o = S.off;
  o.minT = Math.min(o.minT, dT);
  const away = distToPath(pos, path) > 60 || dT > o.minT + 40;
  if (!away){ o.n = 0; o.since = 0; return; }
  if (!o.since) o.since = now;
  const gap = DEMO ? 1000 / SPEED : 4000;
  if (now - o.lastAt >= gap){ o.n++; o.lastAt = now; }
  if (o.n >= 3 || now - o.since >= 45000){ o.n = 0; o.since = 0; openOffroute(); }
}
function startTracking(){
  if (DEMO || S.watch != null || !navigator.geolocation) return;
  try {
    S.watch = navigator.geolocation.watchPosition(
      p => onPos(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
      () => {}, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  } catch (e) {}
}

/* ---------- demo simulator: moves a fake position along a path ---------- */
const SIM = {
  timer: null, kind: null,
  run(kind, path, mps){
    this.stop();
    if (SHOT || !path || path.length < 2) return;
    this.kind = kind;
    const total = pathLen(path), dur = Math.max(1000, total / (mps * SPEED) * 1000);
    let t = 0;
    this.timer = setInterval(() => {
      if (S.paused) return;
      t += 200;
      const p = along(path, Math.min(1, t / dur));
      onPos(p.lat, p.lon, 8);
      if (t >= dur) this.stop();
    }, 200);
  },
  stop(){ if (this.timer) clearInterval(this.timer); this.timer = null; this.kind = null; }
};

const DEF_KIND = { 'בית מרקחת': 'בית המרקחת', 'בנק': 'הבנק', 'סופרמרקט': 'הסופרמרקט', 'מרפאה': 'המרפאה',
  'דואר': 'הדואר', 'בית ספר': 'בית הספר', 'בית כנסת': 'בית הכנסת', 'גן ציבורי': 'הגן הציבורי', 'חנות': 'החנות',
  'בית קפה': 'בית הקפה', 'מסעדה': 'המסעדה', 'מקום': 'המקום', 'כיכר': 'הכיכר', 'תחנת אוטובוס': 'התחנה' };
function landmarkPhrase(it){
  if (it.kind === 'street') return `שלט של רחוב ${it.name}`;
  if (it.isStop) return `את התחנה ${nm(it.name)}`;
  return `את ${it.name}`;              // the card under the question names the kind
}
const normHe = s => String(s || '').replace(/[֑-ׇ]/g, '').replace(/[^א-תA-Za-z0-9]/g, '').replace(/^ה(?=..)/, '').toLowerCase();
function fuzzyPick(seen, items){
  const n = normHe(seen); if (n.length < 2) return null;
  let best = null;
  items.forEach(it => { const m = normHe(it.name); if (m.length >= 2 && (m.includes(n) || n.includes(m)) && (!best || m.length > normHe(best.name).length)) best = it; });
  return best;
}
function journeyStopFor(pos){
  if (!journey) return null;
  const st = journey.step;
  if (st === 'walk' || st === 'stop') return journey.plan.origin_stop;
  if (st === 'finalwalk' || st === 'off') return journey.plan.dest_stop;
  let best = null, bd = Infinity;
  [journey.plan.origin_stop].concat(journey.plan.stops).forEach(s => { const d = dist(pos, s); if (d < bd){ bd = d; best = s; } });
  return best;
}
async function gatherLost(){
  let pos = S.pos;
  if (!DEMO){ const f = await freshFix(8000, 0); if (f) pos = f; }
  pos = pos || (journey && (journey.lastPos || journey.origin)) || FALLBACK.start;
  let street = '', items = [];
  if (DEMO){ street = 'דיזנגוף'; items = DEMO_NEARBY.map(x => Object.assign({}, x)); }
  else {
    const [rev, near] = await Promise.all([
      api('GET', `api/reverse?lat=${pos.lat}&lon=${pos.lon}`, null, 4000),
      api('GET', `api/nearby?lat=${pos.lat}&lon=${pos.lon}`, null, 7000)
    ]);
    street = (rev.ok && rev.street) || '';
    if (near.ok && Array.isArray(near.items))
      items = near.items.filter(x => x && typeof x.name === 'string' && x.name.trim() && !hasLatin(x.name)).slice(0, 8);
  }
  const js = journeyStopFor(pos);
  if (js && dist(pos, js) <= 80){
    items = items.filter(x => x.name !== js.name);
    items.unshift({ name: js.name, kind_he: 'תחנת אוטובוס', dist: Math.round(dist(pos, js)), isStop: true });
  }
  if (!items.length && street) items.push({ name: street, kind: 'street' });
  return { pos, street, items };
}

const cleanHe = s => typeof s === 'string' && s.trim() && s.length <= 160 && !hasLatin(s) && /[א-ת]/.test(s);
async function lostSubmit(text){
  if (S.busy || !text) return;
  S.busy = true; stopListening(); setListening(false);
  const tok = S.helpTok;
  setSay(t('checking'), null, true);
  const L = S.lost, cands = L.items.filter(x => x.kind !== 'street').map(x => x.name);
  const body = { lat: L.pos.lat, lon: L.pos.lon, accuracy: Math.round(S.acc || 0), street: L.street, seen: text, candidates: cands,
                 step: journey ? journey.step : '', route: routeSummary(), gender: settings.gender };
  let r = null;
  if (!DEMO){
    r = await hostCall('whereAmI', body);
    if (!r) r = await api('POST', 'api/where-am-i', body, 8000);
  }
  S.busy = false;
  if (tok !== S.helpTok || S.overlay !== 'lost') return;
  const byName = n => L.items.find(x => x.name === n);
  if (r && r.match && byName(r.match)){ L.landmark = byName(r.match); return lostOrient(); }
  const local = fuzzyPick(text, L.items.filter(x => x.kind !== 'street'));
  if (local){ L.landmark = local; return lostOrient(); }
  if (r && cleanHe(r.text)) return lostOrient(r.text.trim());
  helpScreen(t('noMatch', { L: lName(contactName()) }));
}
function routeSummary(){
  if (!journey) return 'עוד לא נבחר יעד';
  const p = journey.plan;
  return `הליכה לתחנה ${p.origin_stop.name}, קו ${p.line} עד ${p.dest_stop.name}, ואז הליכה אל ${journey.dest.name}`;
}
function hereText(){
  const L = S.lost || {}, you = t('you');
  const lm = L.landmark && L.landmark.kind !== 'street' ? L.landmark.name : '';
  const st = L.street || (L.landmark && L.landmark.kind === 'street' ? L.landmark.name : '');
  if (lm) return `${you} ליד ${lm}.`;           // the thing they can see beats a street name
  return st ? `${you} ברחוב ${st}.` : '';

/* the sentence says where I am; the sub says the one next thing */
function lostOrient(claudeText){
  const L = S.lost, pos = L.pos || S.pos || FALLBACK.start, you = t('you');
  let say = claudeText || hereText(), sub = null, mid = journeyCard(), replan = false, map = null;
  if (journey){
    const st = journey.step, p = journey.plan;
    if (st === 'walk'){
      const dP = distToPath(pos, journey.walkTo.path), m = round50(dist(pos, p.origin_stop));
      if (L.replan || dP > 300) replan = true;
      else { sub = `התחנה ${m} מטר ${dP < 60 ? 'קדימה' : 'ממך'}.`; map = { path: journey.walkTo.path, target: p.origin_stop, label: 'התחנה' }; }
    } else if (st === 'stop'){
      const d = dist(pos, p.origin_stop);
      if (d <= 80){ const mn = minsToBus(); say = `${you} בתחנה הנכונה.`; sub = `קו ${p.line} ${mn <= 0 ? 'מגיע עכשיו' : mn === 1 ? 'מגיע בעוד דקה' : `מגיע בעוד ${mn} דקות`}.`; mid = lineBand(p); }
      else sub = `התחנה ${round50(d)} מטר ממך.`;
    } else if (st === 'ride'){
      const k = Math.max(1, stopsLeft());
      say = `${you} באוטובוס הנכון.`; sub = null;
      mid = (k === 1 ? fig([['עוד תחנה אחת', 'u']]) : fig([['עוד', 'u'], [String(k), 'n'], ['תחנות', 'u']])) + card('pin', p.dest_stop.name, 'כאן יורדים');
    } else if (st === 'passed'){
      replan = true;
    } else {
      const path = (journey.walkFrom.path && journey.walkFrom.path.length > 1) ? journey.walkFrom.path : [P(p.dest_stop), P(journey.dest)];
      const dP = distToPath(pos, path);
      if (L.replan || dP > 300) replan = true;
      else { sub = `היעד ${round50(dist(pos, journey.dest))} מטר ממך.`; map = { path, target: journey.dest, label: 'היעד' }; }
    }
  }
  if (!say && sub){ say = sub; sub = null; }
  if (!say && !replan) say = 'אני לא בטוח איפה בדיוק. אפשר לבקש עזרה.';
  if (replan){ say = t('replanSay'); sub = null; map = legMap(); mid = journeyCard(); }
  render({
    name: 'lost-orient', step: STEP.help, noLost: true, say, sub,
    mid: map ? '<div class="map" id="mapslot" role="img" aria-label="מפה: איפה אני ולאן הולכים"></div>' : mid,
    buttons: replan
      ? [{ id: 'replan', icon: 'compass', label: t('replanBtn'), onTap: replanFromHere }, { id: 'tohelp', kind: 'sec', icon: 'phone', label: t('needHelp'), onTap: () => helpScreen() }]
      : [{ id: 'okgo', icon: 'check', label: journey ? t('okGo') : t('okThanks'), onTap: closeOverlay }, { id: 'tohelp', kind: 'sec', icon: 'phone', label: t('needHelp'), onTap: () => helpScreen() }],
    after(){ if (map){ S.pos = pos; showMap(map); } }
  });
}
function replanFromHere(){
  if (!journey) return closeOverlay();

function shareInfo(){
  const L = S.lost || {}, pos = L.pos || S.pos || FALLBACK.start, you = t('you');
  const lm = L.landmark && L.landmark.kind !== 'street' ? L.landmark.name : '';
  const st = L.street || '';
  const where = [st ? 'רחוב ' + st : '', lm ? 'ליד ' + lm : ''].filter(Boolean).join(', ');
  const url = `https://maps.google.com/?q=${pos.lat.toFixed(5)},${pos.lon.toFixed(5)}`;
  const lines = [`אני כאן: ${where ? where + '. ' : ''}${url}`];
  const plain = [{ icon: 'pin', text: lm ? `ליד ${lm.split(' ')[0]}` : st ? `ברחוב ${st}` : 'במקום שעל המפה' }];
  if (journey && journey.step !== 'arrived'){
    const p = journey.plan, stp = journey.step;
    lines.push(`אני בדרך ל: ${journey.dest.name}.`);
    plain.push({ icon: 'flag', text: `בדרך ל${shortName(journey.dest.name)}` });
    if (stp === 'walk' || stp === 'stop'){
      const m = round50(dist(pos, p.origin_stop)), mn = minsToBus();
      lines.push(`כדאי לי לקחת: קו ${p.line} מתחנת '${p.origin_stop.name}' (${m} מטר ממני), עוד ${mn} דקות, לרדת אחרי ${p.stops.length} תחנות.`);
      plain.push({ icon: 'bus', text: mn <= 0 ? `קו ${p.line}, מגיע עכשיו` : `קו ${p.line}, בעוד ${mn} דקות` });
    } else if (stp === 'ride'){
      lines.push(`אני באוטובוס קו ${p.line}, נשארו ${Math.max(1, stopsLeft())} תחנות עד '${p.dest_stop.name}'.`);
      plain.push({ icon: 'bus', text: `בקו ${p.line}, עוד ${Math.max(1, stopsLeft())} תחנות` });
    } else {
      lines.push(`ירדתי מהאוטובוס. נשארו כ־${round50(dist(pos, journey.dest))} מטר ברגל.`);
      plain.push({ icon: 'walk', text: 'הולך ליעד' });
    }
  }
  lines.push("(נשלח מהאפליקציה 'לאן?')");
  return { text: lines.join('\n'), plain };
}

window.addEventListener('popstate', () => {
  try { history.pushState({ laan: 1 }, ''); } catch (e) {}
  if (S.alertOn){ speak(alertSpeech()); return; }
  if (S.overlay){ closeOverlay(); return; }
  const journeyScreens = ['walk', 'stop', 'ride', 'passed', 'off', 'finalwalk', 'planning', 'checking'];
  if (journey && journey.step !== 'arrived' && journeyScreens.includes(S.screen)){ openExit(); return; }
  if (S.screen === 'confirm'){ S.lastText ? screenDest(S.lastText) : screenDest(); return; }
  if (S.screen === 'settings'){ screenDest(); return; }
  speak(S.speech);
});

/* ---------- wake lock during the walk and the ride ---------- */
async function wakeOn(){
  S.wantWake = true;
  if (SHOT) return;
  try {
    if ('wakeLock' in navigator && !S.wake && document.visibilityState === 'visible'){
      S.wake = await navigator.wakeLock.request('screen');
      S.wake.addEventListener('release', () => { S.wake = null; });
    }
  } catch (e) {}
}
function wakeOff(){ S.wantWake = false; try { if (S.wake) S.wake.release(); } catch (e) {} S.wake = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.wantWake) wakeOn(); });

  { say: 'צבעי המסך', key: 'contrast', opts: [['normal', 'רגיל'], ['hc', 'שחור־צהוב']] },
  { say: 'להקריא את ההוראות?', key: 'voice', opts: [[true, 'כן'], [false, 'לא']] },
  { say: 'מהירות הדיבור', key: 'rate', opts: [[0.85, 'רגיל'], [0.7, 'איטי']] },
  { say: 'איך לפנות אליך?', key: 'gender', opts: [['m', 'אתה'], ['f', 'את']] },
  { say: 'כתובת הבית', kind: 'home' },
  { say: 'מספר לעזרה', kind: 'contact' }
];
function screenSettings(i, silent){
  S.lastBase = () => screenSettings(i);
  const pg = SETTINGS_PAGES[i], last = i === SETTINGS_PAGES.length - 1;
  let mid = '', sub = null;
  if (pg.key){
    mid = `<div class="opts">${pg.opts.map((o, k) => {
      const on = settings[pg.key] === o[0];
      return `<button type="button" class="opt" id="opt${k}" aria-pressed="${on}">${on ? ic('check') : '<span class="slot"></span>'}<span>${esc(o[1])}</span></button>`;
    }).join('')}</div>` + (i <= 1 ? `<div class="sample">${fmt(t('board', { line: 5 }))}</div>` : '');
  } else if (pg.kind === 'home'){
    sub = settings.home ? settings.home.name : t('noHome');
    mid = `<button type="button" class="b-sec" id="chg">${settings.home ? 'לשנות את הכתובת' : 'להוסיף כתובת'}</button>`;
  } else {
    sub = settings.contact ? [settings.contactName, settings.contact].filter(Boolean).join(', ') : t('noContact');
    mid = `<button type="button" class="b-sec" id="chg">${settings.contact ? 'לשנות את המספר' : 'להוסיף מספר'}</button>`;
  }
  render({
    name: 'settings', step: STEP.settings(i + 1, SETTINGS_PAGES.length), say: pg.say, sub, mid, silent,
    buttons: last ? [{ id: 'done', icon: 'check', label: t('setDone'), onTap: () => screenDest() }]
                  : [{ id: 'next', label: t('next'), onTap: () => screenSettings(i + 1) },
                     { id: 'exit', kind: 'sec', label: t('setExit'), onTap: () => screenDest() }],
    after(){
      if (pg.key) pg.opts.forEach((o, k) => $('opt' + k).addEventListener('click', tap(() => {
        settings[pg.key] = o[0]; saveSettings(); applySettings();
        screenSettings(i, true);
        speak(t('chosen', { v: o[1] }));
      })));
      const c = $('chg');
      if (c) c.addEventListener('click', tap(() => {
        if (pg.kind === 'home'){ S.homeCtx = 'settings'; placeScreen('home'); } else screenContact('settings');
      }));
    }
  });
}

/* ---------- map: Leaflet, lazy, reused; a plain schematic when offline ---------- */
const MAP = { el: null, map: null, layer: null, me: null, loading: null, opts: null };
function loadLeaflet(){
  if (window.L) return Promise.resolve(true);
  if (MAP.loading) return MAP.loading;
  MAP.loading = new Promise(res => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    css.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY='; css.crossOrigin = '';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo='; s.crossOrigin = '';
    s.onload = () => res(!!window.L); s.onerror = () => res(false);
    setTimeout(() => res(!!window.L), 8000);
    document.head.appendChild(s);
  });
  return MAP.loading;
}
function schematic(opts){
  const pts = opts.path.concat([P(opts.target)], S.pos ? [P(S.pos)] : []);
  const lat0 = pts[0][0] * Math.PI / 180;
  const xy = p => [p[1] * Math.cos(lat0), -p[0]];
  const ps = pts.map(xy);
  let x0 = Math.min(...ps.map(p => p[0])), x1 = Math.max(...ps.map(p => p[0]));
  let y0 = Math.min(...ps.map(p => p[1])), y1 = Math.max(...ps.map(p => p[1]));
  const w = Math.max(x1 - x0, 1e-5), h = Math.max(y1 - y0, 1e-5), pad = Math.max(w, h) * 0.2;
  x0 -= pad; y0 -= pad;
  const vb = `${x0} ${y0} ${w + 2 * pad} ${h + 2 * pad}`;
  const line = opts.path.map(p => xy(p).join(',')).join(' ');
  const tg = xy(P(opts.target)), me = S.pos ? xy(P(S.pos)) : xy(opts.path[0]);
  const r = Math.max(w, h) * 0.035;
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <polyline points="${line}" fill="none" stroke="#0B3D91" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${tg[0]}" cy="${tg[1]}" r="${r * 1.3}" fill="#B00020" stroke="#fff" stroke-width="4" vector-effect="non-scaling-stroke"/>
    <circle id="schemMe" cx="${me[0]}" cy="${me[1]}" r="${r}" fill="#0B3D91" stroke="#fff" stroke-width="4" vector-effect="non-scaling-stroke"/>
  </svg>`;
}
function showMap(opts){
  const slot = $('mapslot'); if (!slot || !opts.path || opts.path.length < 1) return;
  MAP.opts = opts;
  slot.innerHTML = schematic(opts);
  if (!MAP.el){ MAP.el = document.createElement('div'); MAP.el.id = 'map'; }
  slot.appendChild(MAP.el);
  loadLeaflet().then(ok => {
    if (!ok || MAP.opts !== opts || !MAP.el.isConnected) return;
    try { leafletDraw(opts); } catch (e) {}
  });
}
function leafletDraw(opts){
  if (!MAP.map){
    MAP.map = L.map(MAP.el, { zoomControl: false, doubleClickZoom: false, scrollWheelZoom: false, touchZoom: false,
                              boxZoom: false, keyboard: false, attributionControl: true });
    MAP.map.attributionControl.setPrefix(false);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© תורמי OpenStreetMap' }).addTo(MAP.map);
    MAP.layer = L.layerGroup().addTo(MAP.map);
  }
  MAP.map.invalidateSize();
  MAP.layer.clearLayers();
  L.polyline(opts.path, { color: '#FFFFFF', weight: 12, opacity: 1, interactive: false, lineCap: 'round', lineJoin: 'round' }).addTo(MAP.layer);
  L.polyline(opts.path, { color: '#0B3D91', weight: 8, opacity: 1, interactive: false, lineCap: 'round', lineJoin: 'round' }).addTo(MAP.layer);
  L.marker(P(opts.target), { interactive: false, keyboard: false,
    icon: L.divIcon({ className: 'lf-icon', iconSize: [0, 0], iconAnchor: [0, 0],
      html: `<span class="pin-head"></span><span class="lbl pin-lbl">${fmt(opts.label)}</span>` }) }).addTo(MAP.layer);
  const me = S.pos ? P(S.pos) : opts.path[0];
  MAP.me = L.marker(me, { interactive: false, keyboard: false, zIndexOffset: 1000,
    icon: L.divIcon({ className: 'lf-icon', iconSize: [0, 0], iconAnchor: [0, 0],
      html: `<span class="me-dot"></span><span class="lbl me-lbl">${esc(t('you'))}</span>` }) }).addTo(MAP.layer);
  MAP.map.fitBounds(L.latLngBounds(opts.path.concat([P(opts.target), me])),
    { paddingTopLeft: [60, 80], paddingBottomRight: [60, 56], maxZoom: 18, animate: false });
  const shown = MAP.el.parentNode && MAP.el.parentNode.querySelector('svg');
  if (shown) shown.style.display = 'none';
  keepLabelsIn();
}
/* a label that would poke out of the panel is nudged back in (or flipped to the other side of its marker) */
function keepLabelsIn(){
  const box = MAP.el && MAP.el.getBoundingClientRect(); if (!box || !box.width) return;
  MAP.el.querySelectorAll('.lbl').forEach(l => {
    l.style.marginLeft = '0px';
    let r = l.getBoundingClientRect();
    if (r.top < box.top + 4 && l.classList.contains('pin-lbl')){ l.style.bottom = 'auto'; l.style.top = '14px'; r = l.getBoundingClientRect(); }
    if (r.bottom > box.bottom - 18 && l.classList.contains('me-lbl')){ l.style.top = 'auto'; l.style.bottom = '22px'; r = l.getBoundingClientRect(); }
    let dx = 0;
    if (r.left < box.left + 6) dx = box.left + 6 - r.left;
    if (r.right > box.right - 6) dx = box.right - 6 - r.right;
    if (dx) l.style.marginLeft = dx + 'px';
  });
}
function updateMe(){
  if (!S.pos) return;
  if (MAP.me && MAP.el && MAP.el.isConnected){ try { MAP.me.setLatLng(P(S.pos)); } catch (e) {} }
  const c = document.getElementById('schemMe');
  if (c && MAP.opts){
    const lat0 = (MAP.opts.path[0] || P(MAP.opts.target))[0] * Math.PI / 180;
    c.setAttribute('cx', S.pos.lon * Math.cos(lat0)); c.setAttribute('cy', -S.pos.lat);
  }
}

/* ---------- ?screen=<id>: one screen with realistic demo content, frozen ---------- */
function shotJourney(step, extra){
  const plan = fallbackPlan(FALLBACK.dest);
  journey = Object.assign({
    dest: Object.assign({}, FALLBACK.dest), plan, origin: Object.assign({}, FALLBACK.start),
    walkTo: { meters: Math.round(pathLen(FALLBACK.walkTo)), path: FALLBACK.walkTo.slice() },
    walkFrom: { meters: Math.round(dist(plan.dest_stop, FALLBACK.dest)), path: [P(plan.dest_stop), P(FALLBACK.dest)] },
    step, walking: false, passedIdx: -1, departsAt: Date.now() + 4 * MINUTE + 5000, alert: null, minDest: null, lastPos: null,
    startedAt: Date.now() - 18 * MINUTE, arrivedAt: Date.now()
  }, extra || {});
}
function shotLost(){
  S.lost = { pos: along(FALLBACK.walkTo, 0.35), street: 'דיזנגוף', items: DEMO_NEARBY.map(x => Object.assign({}, x)), landmark: null, ready: true };
  S.pos = S.lost.pos;
}

    settings.recent = [{ name: 'מרפאת כללית, דיזנגוף', lat: FALLBACK.dest.lat, lon: FALLBACK.dest.lon }, { name: 'קניון דיזנגוף סנטר', lat: 32.0754, lon: 34.7749 }];
    screenDest();
  },

  'planning':     () => screenPlanning(),
  'walk':         () => { shotJourney('walk'); screenWalk(); },
  'stop':         () => { shotJourney('stop'); S.pos = P2(FALLBACK.stops[0]); screenStop(); },
  'ride':         () => { shotJourney('ride', { passedIdx: 1 }); S.pos = P2(FALLBACK.stops[2]); screenRide(); },
  'alert':        () => { shotJourney('ride', { passedIdx: 3 }); S.pos = P2(FALLBACK.stops[4]); screenRide(); },
  'off':          () => { shotJourney('off', { passedIdx: 4 }); screenOff(); },

  'arrived':      () => { shotJourney('arrived'); screenArrived(); },
  'resume':       () => { shotJourney('ride', { passedIdx: 1 }); screenResume(); },
  'nodirect':     () => screenNoDirect(FALLBACK.dest),
  'notfound':     () => { settings.visits = 1; screenDest('בית החולים הגדול'); setSay(t('notFound'), t('notFoundSub'), false); },
  'lost-calm':    () => { shotJourney('walk', { walking: true }); shotLost(); lostBase(); renderLostCalm(); },

  'help':         () => { shotJourney('walk', { walking: true }); shotLost(); S.lost.landmark = S.lost.items[0]; helpScreen(); },
  'sent':         () => { shotJourney('walk', { walking: true }); shotLost(); S.lost.landmark = S.lost.items[0]; sentScreen(shareInfo(), false); },
  'offroute':     () => { shotJourney('walk', { walking: true }); S.pos = { lat: 32.0757, lon: 34.7772 }; S.overlay = 'offroute'; S.paused = true; renderOffroute(); },
  'settings':     () => screenSettings(0),

  'ambiguous':    () => screenAmbiguous([{ name: 'כללית, דיזנגוף 150', lat: 32.0895, lon: 34.7732 }, { name: 'כללית, ארלוזורוב 40', lat: 32.0880, lon: 34.7790 }]),
  'toofar':       () => screenTooFar(),
  'tooclose':     () => screenTooClose({ name: 'הדואר', lat: 32.0770, lon: 34.7760 }, FALLBACK.start),
  'nightnoservice': () => { S.lastBase = null; render({ name: 'nightnoservice', step: STEP.plan, say: t('noService'), mid: noServiceMid('בשבת בערב', '19:10'),
                      buttons: [contactBtn('pri'), { id: 'back', kind: 'sec', label: t('backStart'), onTap: () => screenDest() }] }); },
  'noperm':       () => screenNoPerm(),
  'wrongside':    () => { shotJourney('walk', { walking: true }); S.pos = P2(FALLBACK.stops[0]); caseWrongSide(); },
  'gpsweak':      () => { shotJourney('walk', { walking: true }); caseGpsWeak(); },
  'late':         () => { shotJourney('stop'); openLate(); },
  'missed':       () => { shotJourney('stop'); caseMissed(); },

  'waitlong':     () => { shotJourney('stop'); caseWaitLong(); },
  'passed':       () => { shotJourney('passed', { passedIdx: 3 }); screenPassed(); },
  'alertmissed':  () => { shotJourney('ride', { passedIdx: 3 }); S.pos = P2(FALLBACK.stops[4]); screenRide(); alertMissed(); },
  'detour':       () => { shotJourney('ride', { passedIdx: 2 }); caseDetour(); },
  'nocontact':    () => { shotJourney('walk', { walking: true }); shotLost(); settings.contact = null; settings.contactName = ''; helpScreen(); },
  'battery':      () => { shotJourney('ride', { passedIdx: 1 }); caseBattery(); },
  'offline':      () => { shotJourney('walk', { walking: true }); caseOffline(); },
  'novoice':      () => { settings.visits = 1; screenDest(); const n = $('notice'); n.textContent = t('noVoice'); n.hidden = false; },
  'exit':         () => { shotJourney('ride', { passedIdx: 1 }); openExit(); }
};
function P2(o){ return { lat: o.lat, lon: o.lon }; }
window.laanShots = Object.keys(SHOTS);

/* ---------- start ---------- */
const journeyActive = () => !!(journey && journey.step && journey.step !== 'arrived');
window.addEventListener('offline', () => { if (!DEMO && journeyActive() && !S.overlay && !S.alertOn) caseOffline(); });
try {
  if (!DEMO && navigator.getBattery) navigator.getBattery().then(b => {
    const chk = () => { if (journeyActive() && b.level < 0.15 && !b.charging && !S.batteryShown && !S.overlay && !S.alertOn){ S.batteryShown = true; caseBattery(); } };
    b.addEventListener('levelchange', chk); setInterval(chk, 60000);
  }).catch(() => {});
} catch (e) {}
$('again').addEventListener('click', tap(() => speak(S.alertOn ? alertSpeech() : S.speech)));
$('lost').addEventListener('click', tap(() => openLost()));
function init(){
  applySettings();
  if (DEMO) $('badge').hidden = false;
  try { history.replaceState({ laan: 0 }, ''); history.pushState({ laan: 1 }, ''); } catch (e) {}
  if (SHOT){
    settings.contact = '050-1234567'; settings.contactName = 'רותי';
    (SHOTS[SHOT] || SHOTS['dest-first'])();
    return;
  }
  if (!settings.done){ screenWelcome(); return; }
  if (!DEMO){ settings.visits = (settings.visits || 0) + 1; saveSettings(); }
  startTracking();
  if (journey && journey.step && journey.step !== 'arrived' && journey.dest && journey.plan) screenResume();
  else { journey = null; screenDest(); }
}
/* wait (≤ 1.5 s) for an optional host bridge, then start */
async function boot(){
  if (window.LAAN_FRAMED) return;
  if (document.readyState === 'loading') await new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }));
  const ready = window.LaanHostReady;
  const waitHost = (ready && typeof ready.then === 'function') ? Promise.race([ready.catch(() => {}), sleep(1500)]) : null;
  // no answer from api/health within 1.5 s → treat as static hosting: fallbacks at once, no timeouts
  const probe = (DEMO || STATIC_NO_SERVER || noServer()) ? null : (async () => {
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    const tm = setTimeout(() => { try { ctl && ctl.abort(); } catch (e) {} }, 1500);
    try { const r = await fetch('api/health', { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
          const j = r.ok ? await r.json() : null; if (!j || j.ok !== true) STATIC_NO_SERVER = true; }
    catch (e) { STATIC_NO_SERVER = true; }
    finally { clearTimeout(tm); }
  })();
  await Promise.all([waitHost, probe]);
  init();
}
boot();
try {
  if (!SHOT && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol))
    navigator.serviceWorker.register('sw.js').catch(() => {});
} catch (e) {}
</script>
